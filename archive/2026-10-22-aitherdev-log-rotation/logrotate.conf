weekly
missingok
notifempty
rotate 4

"/var/log/btmp" {
  create 0660 root utmp
  monthly
  minsize 1M
  rotate 1
}

"/var/log/wtmp" {
  create 0664 root utmp
  monthly
  minsize 1M
  rotate 1
}

"/var/log/nginx/*.log" {
  compress
  delaycompress
  weekly
  postrotate
    [ ! -f /var/run/nginx/nginx.pid ] || kill -USR1 `cat /var/run/nginx/nginx.pid`
  endscript
  rotate 26
  su nginx nginx
}

"/var/log/messages"
"/var/log/warn"
"/var/log/mail"
"/var/log/dhcpd" {
  compress
  create
  nodateext
  delaycompress
  daily
  maxsize 100M
  missingok
  notifempty
  postrotate
    /nix/store/kmzlca218j6j1ar292fxj7707qzypij8-systemd-260.5/bin/systemctl kill --kill-whom=main --signal=HUP syslog.service

  endscript
  rotate 14
  sharedscripts
}
