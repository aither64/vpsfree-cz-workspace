- language: cs
  page: informace:jak_psat
  before: |
    Každý popis navigace, položky nabídky nebo formuláře ve vpsAdminu musí být
    uzavřen v párovém tagu ''%%<vpsadmin-nav>%%''. Atribut ''id'' obsahuje stabilní
    sémantický identifikátor daného ovládacího prvku. Viditelný text zůstává česky
