  replacement: |
    Každý pokyn k provedení akce ve vpsAdminu i každý popis navigace, položky
    nabídky nebo formuláře musí být uzavřen v párovém tagu
    ''%%<vpsadmin-nav>%%''. Platí to i pro pokyn, který pouze říká změnit nastavení
    a výslovně nezmiňuje nabídku ani formulář. Atribut ''id'' obsahuje stabilní
    sémantický identifikátor daného ovládacího prvku. Viditelný text zůstává česky
    a musí odpovídat názvům v aktuálním webovém rozhraní.
- language: en
  page: information:kb
  before: |
    Every description of navigation, a menu entry, or a form in vpsAdmin must be
    wrapped in a paired ''%%<vpsadmin-nav>%%'' tag. Its ''id'' attribute contains
    the stable semantic identifier of that control. The visible text remains in
    English and must match the current WebUI labels.
  replacement: |
    Every instruction to perform an action in vpsAdmin, as well as every
    description of navigation, a menu entry, or a form, must be wrapped in a paired
    ''%%<vpsadmin-nav>%%'' tag. This also applies when an instruction only says to
    change a setting without explicitly naming a menu or form. Its ''id'' attribute
    contains the stable semantic identifier of that control. The visible text
    remains in English and must match the current WebUI labels.
