  before: |
    ===== Dokumentace vpsAdminu =====
    ==== Navigace ve vpsAdminu ====
    Každý popis navigace, položky nabídky nebo formuláře ve vpsAdminu musí být
    uzavřen v párovém tagu ''%%<vpsadmin-nav>%%''. Atribut ''id'' obsahuje stabilní
    sémantický identifikátor daného ovládacího prvku. Viditelný text zůstává česky
    a musí odpovídat názvům v aktuálním webovém rozhraní.

    Například:

    <code>
    <vpsadmin-nav id="member.public-keys.add">Upravit profil → Veřejné klíče → Přidat veřejný klíč</vpsadmin-nav>
    </code>

    Identifikátory nevymýšlejte jen v textu KB. Musejí být součástí
    [[https://github.com/vpsfreecz/vpsadmin-kb-captures/blob/master/contract/navigation.yml|navigačního kontraktu]].
    Pokud potřebný identifikátor neexistuje nebo se webové rozhraní mění, postupujte
    podle [[https://github.com/vpsfreecz/vpsadmin-kb-captures/blob/master/docs/webui-change-workflow.md|workflow pro změny webového rozhraní]].

    ==== Screenshoty vpsAdminu ====
    Screenshoty vpsAdminu nevytvářejte ani nenahrávejte ručně. Jsou reprodukovatelně
    generovány pomocí Playwright scénářů, vývojového clusteru a připravených dat v
    repozitáři [[https://github.com/vpsfreecz/vpsadmin-kb-captures|vpsadmin-kb-captures]].
    Repozitář spravuje českou i anglickou variantu každého screenshotu. Nový nebo
    změněný screenshot je potřeba upravit a znovu vygenerovat tam, zkontrolovat ve
    staging KB a teprve potom publikovat.

