- language: cs
  page: navody:notifikace
  body: |
    <page>manuals:notifications</page>
    ====== Notifikace ======

    Notifikační systém vpsAdminu převádí události na e-mailová, SMS, telegramová
    nebo webhooková doručení. Najdete jej v
    <vpsadmin-nav id="notifications.open">hlavní nabídce **Notifikace**</vpsadmin-nav>.

    Základní tok je **událost → routa → příjemce → cíl**:

      * **událost** popisuje, co se stalo,
      * **routa** vybírá události a určuje, zda směrování pokračuje,
      * **příjemce** popisuje, koho nebo kterou integraci upozornit,
      * **cíl** je konkrétní e-mail, telefonní číslo, chat v Telegramu nebo webhookový endpoint.

    Historie doručování není interní auditní protokol. Událost se do ní uloží
    pouze tehdy, když směrování připraví alespoň jedno skutečné doručení. Pokud
    potřebujete úplný externí záznam, vytvořte záchytnou routu pro všechny typy
    událostí a doručujte ji do vlastního trvalého úložiště, například webhookem.

    ===== Nejdříve si přečtěte =====

      * [[navody:notifikace:udalosti|Události a typy událostí]] vysvětlují, co událost obsahuje, jaké rodiny typů existují a kde najít aktuální katalog.
      * [[navody:notifikace:routovani|Routování událostí a podmínky]] popisuje pořadí rout, podrouty, matchery, operátory a testování.
      * [[navody:notifikace:cile_a_prijemci|Cíle a příjemci]] vysvětlují doručovací endpointy a jejich opakovaně použitelné skupiny.

    ===== Příklady krok za krokem =====

    Každý příklad začíná u běžného účtu s výchozími routami. Postupujte vždy podle
    jednoho samostatného návodu:

      * [[navody:notifikace:role_udalosti|Doručení událostí rolí account a admin různým kontaktům]]
      * [[navody:notifikace:ztlumeni_oom|Ztlumení vybraných OOM reportů]]
      * [[navody:notifikace:ztlumeni_incidentu|Ztlumení vybraných incidentních reportů]]
      * [[navody:notifikace:telegram|Odeslání monitoringu a incidentů do Telegramu]]
      * [[navody:notifikace:sms|Odeslání SMS při pozastavení účtu nebo VPS]]
      * [[navody:notifikace:webhook|Odeslání změn prostředků VPS na webhook]]

    ===== Pokročilé možnosti =====

    <vpsadmin-nav id="notifications.route-grouping-form.open">Seskupování na
    routě</vpsadmin-nav> sbírá související události do jednoho souhrnu; rozepsané
    i minulé souhrny ukazuje <vpsadmin-nav id="notifications.groups.open">seznam
    skupin notifikací</vpsadmin-nav>. Opakovaně použitelný rozvrh vytvoříte v
    <vpsadmin-nav id="notifications.time-intervals.open">**Notifikace → Časové
    intervaly**</vpsadmin-nav> a k routě jej připojíte jako aktivní nebo ztlumující
    přes <vpsadmin-nav id="notifications.route-time-intervals.open">nastavení
    časových intervalů routy</vpsadmin-nav>.

    Skutečně připravená doručení a odpovídající routy najdete v
    <vpsadmin-nav id="notifications.event-route-matches.open">**Notifikace →
    Historie doručování → detail události**</vpsadmin-nav>.
- language: cs
  page: navody:notifikace:udalosti
  body: |
    <page>manuals:notifications:events</page>
    ====== Události a typy událostí ======

    **Událost** je strukturovaná zpráva o tom, co se ve vpsAdminu stalo. Může
    oznamovat například přihlášení, změnu stavu VPS, OOM report, incident,
    monitoringový problém nebo dokončení operace. Událost má vždy **typ**
    (například ''vps.oom_report''), závažnost a sadu pojmenovaných polí.

    Typ události je popis možných událostí, nikoli jedna konkrétní událost.
    Určuje výchozí závažnost, zda se typ doručuje výchozími routami, a která
    pole lze použít v podmínkách. Aktuální katalog otevřete v
    <vpsadmin-nav id="notifications.event-types.open">**Notifikace → Typy
    událostí**</vpsadmin-nav>.

    {{:cs:screenshots:vpsadmin:notifications:event-types.png?900|Kategorie v aktuálním katalogu typů událostí}}

    ===== Rodiny událostí =====

    Katalog se vyvíjí spolu s vpsAdminem, proto je stránka **Typy událostí**
    přesnějším zdrojem než pevný seznam v dokumentaci. Typy jsou seskupeny do
    rodin:

      * **účet a bezpečnost** – vznik a stav účtu, přihlášení, tokeny, TOTP a upozornění na expiraci,
      * **VPS** – životní cyklus, změny prostředků a sítě, konzole, OOM reporty a prevence,
      * **monitoring, incidenty a výpadky** – problémy zjištěné monitoringem a zprávy vztahující se k vašim službám,
      * **úložiště a migrace** – změny datasetů, snapshoty, připravené stažení a přesuny,
      * **operace a změny prostředků** – průběh operací a typované změny objektů, například ''vps.updated'',
      * **požadavky a platby** – změny uživatelských požadavků a platební události,
      * **systém** – průběh operací spuštěných uživatelem; interní provozní typy vpsAdminu jsou určené administrátorům a zůstávají skryté.

    Běžný účet vidí jen typy, které může smysluplně použít pro své routy.
    Interní typy infrastruktury zůstávají skryté.

    ===== Pole události =====

    Každý typ obsahuje společná pole, například ''event_type'', ''severity'',
    ''subject'', ''summary'', ''roles'' a ''default_routed'', a může přidat
    vlastní pole. ''vps.oom_report'' například nabízí ''vps_id'',
    ''vps_hostname'', ''cgroup'', ''oom_count'' a ''killed_name''.

    V detailu typu je u každého pole uveden datový typ, příklad a význam.
    Formulář podmínky podle datového typu nabídne jen použitelné operátory.

    {{:cs:screenshots:vpsadmin:notifications:event-type-vps-oom-report.png?900|Pole typu události vps.oom_report}}

    Pole ''roles'' označuje výchozí roli pro směrování, ne oprávnění uživatele.
    Typ vlastněný účtem proto může být v katalogu běžného uživatele, i když má
    roli ''admin''. Jedna událost může mít také role ''account'' i ''admin''.

    ===== Kdy se událost objeví v historii =====

    <vpsadmin-nav id="notifications.event-route-matches.open">**Notifikace →
    Historie doručování → detail události**</vpsadmin-nav> není úplný auditní
    protokol. Kandidát se uloží pouze tehdy, když routování připraví alespoň
    jedno skutečné doručení. Pokud všechny odpovídající routy pouze ztlumí
    událost nebo přeskočí svůj příjemce kvůli aktivnímu či ztlumujícímu
    intervalu a žádná jiná routa ani podrouta nevytvoří doručení, událost se v
    historii neobjeví. Neobjeví se ani událost bez odpovídající routy.

    Pokračujte článkem [[navody:notifikace:routovani|Routování a podmínky]].

- language: cs
  page: navody:notifikace:routovani
  body: |
    <page>manuals:notifications:routing</page>
    ====== Routování událostí a podmínky ======

    **Routa** je pravidlo, které rozhoduje, zda má být událost předána určitému
    příjemci. Obsahuje výběr typu události, nula nebo více podmínek, příjemce a
    chování **Pokračovat**. Routy spravujete v
    <vpsadmin-nav id="notifications.routes.open">**Notifikace → Routy**</vpsadmin-nav>.

    {{:cs:screenshots:vpsadmin:notifications:routes.png?900|Základní seznam vlastní a výchozích rout}}

    ===== Jak se routy vyhodnocují =====

      - vpsAdmin začne kořenovými routami a sourozence zkouší shora dolů.
      - Routa odpovídá pouze tehdy, když odpovídá výběr typu a **všechny** její podmínky. Podmínky jedné routy se tedy spojují logickým **a**.
      - Po shodě aktivní a ztlumující intervaly rozhodnou, zda se zpracuje příjemce této routy. Intervaly nemění shodu routy a nebrání vyhodnocení jejích podrout.
      - Po shodě se vyhodnotí také odpovídající podrouty, i když interval přeskočil příjemce rodičovské routy.
      - **Pokračovat: ano** dovolí zkoušet další sourozenecké routy na stejné úrovni. **Pokračovat: ne** další sourozence na této úrovni zastaví.

    Podrouty se po shodě rodiče vyhodnotí bez ohledu na nastavení
    **Pokračovat** rodiče. Toto nastavení řídí sourozence, nikoli vstup do větve
    podrout.

    Výchozí routy používají pole ''default_routed'' a ''roles''. Vlastní routy
    jsou před nimi, takže můžete konkrétní události nejprve přesměrovat nebo
    ztlumit. Ztlumující routa obvykle používá příjemce **Ztlumit** a
    **Pokračovat: ne**.

    ===== Výběr typu události =====

      * **Typ události** vybere jeden přesný typ, například ''vps.oom_report''.
      * **Vzor typu události** používá glob, například ''monitoring.*''.
      * Jsou-li obě pole prázdná, routa může odpovídat všem typům.

    Přesná routa nabízí společná pole i vlastní pole vybraného typu. Routa se
    vzorem nebo bez typu může použít jen společná pole. Dostupné typy a pole
    ověřte v [[navody:notifikace:udalosti|katalogu typů událostí]].

    ===== Podmínky a operátory =====

    Podmínka neboli **matcher** porovnává jedno pole události se zadanou
    hodnotou. Přidává se v detailu uložené routy. Formulář otevřete přes
    <vpsadmin-nav id="notifications.matcher-form.open">**Notifikace → Routy →
    upravit routu → Přidat matcher**</vpsadmin-nav>.

    Operátory závisí na datovém typu:

    ^ Typ pole ^ Operátory ^ Význam ^
    | text | ''=='', ''!='' | rovnost a nerovnost |
    | text | ''=~'', ''!~'' | odpovídá nebo neodpovídá regulárnímu výrazu |
    | text | ''=*'', ''!*'' | odpovídá nebo neodpovídá glob vzoru; ''*'' odpovídá části a ''**'' více úrovním cesty |
    | celé nebo desetinné číslo, datum a čas | ''=='', ''!='', ''>'', ''>='', ''<'', ''<='' | číselné nebo časové porovnání |
    | logická hodnota | ''=='', ''!='' | porovnání ''true''/''false'' |
    | seznam textů nebo čísel | ''contains'', ''not_contains'' | seznam obsahuje nebo neobsahuje položku |

    Například podmínka ''cgroup =* /user.slice/**/*.scope'' vybere OOM reporty
    z uživatelských relací. Další podmínka ''vps_id == 123'' omezí stejnou routu
    na jednu VPS; platit musí obě.

    {{:cs:screenshots:vpsadmin:notifications:matcher-form.png?900|Podmínka pole cgroup a přehled operátorů}}

    ===== Ověření routování =====

    V
    <vpsadmin-nav id="notifications.test-notification.open">**Notifikace →
    Testovací notifikace**</vpsadmin-nav> vyberte typ a zadejte JSON s jeho poli.
    Test používá skutečné routování a skutečné cíle; může proto opravdu odeslat
    e-mail, SMS, Telegram nebo webhook. Neprovádí však skutečnou provozní akci,
    například nepozastaví VPS.

    Pokud žádná povolená routa nepřipraví doručení, test skončí chybou a událost
    se neuloží. Úspěšný výsledek zkontrolujte v detailu Historie doručování.

    Viz také [[navody:notifikace:cile_a_prijemci|Cíle a příjemci]] a praktické
    příklady v [[navody:notifikace|přehledu notifikací]].

- language: cs
  page: navody:notifikace:cile_a_prijemci
  body: |
    <page>manuals:notifications:targets_and_receivers</page>
    ====== Cíle a příjemci ======

    Routa neposílá událost přímo na adresu. Odkazuje na **příjemce** a ten
    obsahuje jeden nebo více **cílů**:

      * **cíl** je konkrétní doručovací endpoint, například e-mailová adresa, telefonní číslo, telegramový chat nebo URL webhooku,
      * **příjemce** je pojmenovaná skupina cílů, kterou lze použít z více rout.

    Jedna událost předaná příjemci se připraví pro každý jeho povolený cíl.
    Stejný cíl lze připojit k více příjemcům a cíle lze měnit bez přepisování
    rout.

    ===== Cíle =====

    Seznam otevřete v
    <vpsadmin-nav id="notifications.targets.open">**Notifikace → Cíle**</vpsadmin-nav>.
    U každého cíle vidíte způsob doručení, endpoint, stav povolení a ověření.

    {{:cs:screenshots:vpsadmin:notifications:targets.png?900|Seznam notifikačních cílů}}

    Při přidání nebo úpravě cíle přes
    <vpsadmin-nav id="notifications.target-form.open">**Notifikace → Cíle →
    přidat nebo upravit cíl**</vpsadmin-nav> zvolíte jeden způsob doručení:

      * **E-mail** může použít adresu účtu nebo vlastní adresu. Vlastní adresa musí být ověřena odkazem z ověřovací zprávy.
      * **SMS** používá telefonní číslo v mezinárodním formátu E.164 a před doručováním vyžaduje ověřovací kód.
      * **Telegram** se spáruje s konkrétním chatem pomocí jednorázového párovacího příkazu.
      * **Webhook** odesílá JSON na veřejnou HTTP(S) URL. Volitelný tajný klíč podepisuje přesné tělo hlavičkou ''X-VpsAdmin-Signature-256''.

    Vypnutý, neověřený nebo nespárovaný cíl zprávy nepřijímá. Globálně vypnutý
    způsob doručení také pozastaví všechny cíle daného typu.

    ===== Příjemci =====

    Příjemce vytvoříte v
    <vpsadmin-nav id="notifications.receivers.open">**Notifikace →
    Příjemci**</vpsadmin-nav>. Dejte mu název podle účelu, například
    **Pohotovost** nebo **Webhook změn prostředků**.

    Po otevření přes
    <vpsadmin-nav id="notifications.receiver-form.open">**Notifikace → Příjemci
    → upravit příjemce**</vpsadmin-nav> můžete měnit jeho popis, povolení a
    připojené cíle.

    {{:cs:screenshots:vpsadmin:notifications:receiver.png?900|Nastavení příjemce a tabulka jeho cílů}}

    Vypnutí příjemce zastaví všechna doručení přes něj, aniž by bylo nutné měnit
    jednotlivé routy. Příjemce s více cíli rozvětví doručení například současně
    do e-mailu a Telegramu.

    Vestavěný příjemce **Ztlumit** je zvláštní: nemá doručovací endpoint a
    odpovídající událost potlačí. Používá se ve ztlumujících routách, obvykle s
    vypnutým **Pokračovat**.

    Pokračujte článkem [[navody:notifikace:routovani|Routování událostí]] nebo
    si vyberte praktický postup v [[navody:notifikace|přehledu notifikací]].

- language: cs
  page: navody:notifikace:role_udalosti
  body: |
    <page>manuals:notifications:event_roles</page>
    ====== Doručení událostí podle role account nebo admin ======

    Role události jsou štítky používané výchozími routami a můžete je porovnávat
    i ve vlastních podmínkách. Neurčují, které typy událostí uživatel vidí v
    katalogu, neudělují oprávnění ve vpsAdminu a nesouvisejí s přístupovou rolí
    uživatele.

    Role ''account'' se používá pro správu členství a účtu, platby a vyúčtování,
    požadavky a bezpečnostní zprávy určené majiteli účtu nebo účetnímu. Role
    ''admin'' se používá pro provoz VPS, monitoring, OOM a incidentní reporty,
    zálohy a migrace běžně směrované technickému správci. Typ s rolí ''admin''
    může být přesto viditelný běžnému účtu a použitelný v jeho routách, pokud se
    týká jeho prostředků. Konkrétní role ověřte na stránce **Typy událostí**.
    Jedna událost může mít obě role; potom ji dostanou oba kontakty.

    Nejprve si přečtěte [[navody:notifikace|přehled notifikačního systému]],
    [[navody:notifikace:udalosti|události]], [[navody:notifikace:routovani|routování]]
    a [[navody:notifikace:cile_a_prijemci|cíle a příjemce]].

    ===== Krok 1: Vytvořte a ověřte dva e-mailové cíle =====

    V <vpsadmin-nav id="notifications.target-form.open">**Notifikace →
    Cíle**</vpsadmin-nav> přidejte dva e-mailové cíle, například **E-mail účtu** a
    **E-mail správce**. Než budete pokračovat, otevřete odkaz v každé ověřovací
    zprávě.

    ===== Krok 2: Vytvořte dva příjemce =====

    V <vpsadmin-nav id="notifications.receiver-form.open">**Notifikace →
    Příjemci**</vpsadmin-nav> vytvořte **Kontakt účtu**. Otevřete jej a přidejte
    ověřený cíl **E-mail účtu**.

    Stejně vytvořte **Kontakt správce** a přidejte **E-mail správce**.

    {{:cs:screenshots:vpsadmin:notifications:example-role-receiver.png?900|E-mailový cíl připojený k příjemci Kontakt účtu}}

    ===== Krok 3: Přidejte routu role account =====

    V <vpsadmin-nav id="notifications.routes.open">**Notifikace →
    Routy**</vpsadmin-nav> zvolte **Přidat routu**:

    ^ Pole ^ Hodnota ^
    | Název | ''Události role account'' |
    | Typ události | ponechte prázdný |
    | Vzor typu události | ponechte prázdný |
    | Příjemce | Kontakt účtu |
    | Povoleno | ano |
    | Pokračovat | ano |

    Routu uložte. V jejím detailu zvolte **Přidat podmínku**:

    ^ Nastavení podmínky ^ Hodnota ^
    | Typ události | Libovolný typ události |
    | Pole | ''roles'' |
    | Operátor | obsahuje položku seznamu |
    | Hodnota | ''account'' |

    {{:cs:screenshots:vpsadmin:notifications:example-role-routing.png?900|Routa role account s podmínkou roles}}

    ===== Krok 4: Přidejte routu role admin =====

    Zopakujte Krok 3 s názvem **Události role admin**, příjemcem **Kontakt
    správce** a hodnotou podmínky ''admin''. **Pokračovat** nechte zapnuté.

    {{:cs:screenshots:vpsadmin:notifications:example-role-admin-route.png?900|Routa role admin s podmínkou roles}}

    Díky zapnutému **Pokračovat** se událost s oběma rolemi doručí oběma
    kontaktům a mohou ji zpracovat i další routy.

    ===== Krok 5: Ověřte výsledek =====

    Vytvořte **Testovací notifikaci** typu ''vps.suspended''. Tento typ má role
    ''account'' i ''admin''. Zadejte například:

    <code json>
    {
      "vps_id": 123,
      "vps_hostname": "example-vps",
      "state": "suspended",
      "reason": "Role routing test"
    }
    </code>

    Hodnoty jsou pouze obsahem testovací události; skutečná VPS se nepozastaví.
    Ukázka záměrně vynechává položku ''roles''. Chcete-li otestovat výchozí
    role vybraného typu, položku nepřidávejte; explicitně uvedená hodnota by je
    v testovací události přepsala.

    Vytvořenou událost otevřete v
    <vpsadmin-nav id="notifications.event-route-matches.open">**Notifikace →
    Historie doručování → detail události**</vpsadmin-nav>. V tabulce
    odpovídajících rout musí
    být obě nové routy. Test provádí skutečná doručení, takže zprávu mají dostat
    obě ověřené adresy.

    {{:cs:screenshots:vpsadmin:notifications:example-role-result.png?900|Testovací notifikace odpovídající oběma rolovým routám}}
- language: cs
  page: navody:notifikace:ztlumeni_oom
  body: |
    <page>manuals:notifications:mute_oom</page>
    ====== Ztlumení vybraných OOM reportů ======

    Tento příklad ztlumí OOM reporty z cgroups uživatelských relací na VPS s ID
    ''123''. Ostatní OOM reporty se nezmění. Použije se vestavěný příjemce
    **Ztlumit**, takže není třeba vytvářet cíl ani příjemce.

    Nejprve si přečtěte [[navody:notifikace|přehled notifikačního systému]],
    [[navody:notifikace:udalosti|události]], [[navody:notifikace:routovani|routování]]
    a [[navody:notifikace:cile_a_prijemci|cíle a příjemce]].

    ===== Krok 1: Najděte hodnoty skutečného OOM reportu =====

    V historii doručování otevřete odpovídající ''vps.oom_report'' a
    poznamenejte si pole ''vps_id'' a ''cgroup''. Cgroup je úplná cesta bez prefixu
    ''/sys/fs/cgroup'', například
    ''/user.slice/user-1000.slice/session-2.scope''.

    ===== Krok 2: Vytvořte ztlumující routu =====

    V <vpsadmin-nav id="notifications.routes.open">**Notifikace →
    Routy**</vpsadmin-nav> zvolte **Přidat routu**:

    ^ Pole ^ Hodnota ^
    | Název | ''Ztlumit vybrané OOM reporty'' |
    | Typ události | ''vps.oom_report'' |
    | Příjemce | Ztlumit |
    | Povoleno | ano |
    | Pokračovat | ne |

    Routu uložte.

    ===== Krok 3: Přidejte obě podmínky =====

    Do uložené routy přidejte:

    ^ Pole ^ Operátor ^ Hodnota ^
    | ''vps_id'' | rovná se | ''123'' |
    | ''cgroup'' | odpovídá glob vzoru | %%/user.slice/**/*.scope%% |

    Všechny podmínky musí platit současně. V globu může %%**%% odpovídat několika
    úrovním adresářů.

    {{:cs:screenshots:vpsadmin:notifications:example-mute-oom.png?900|Ztlumení OOM reportů podle VPS a cgroup}}

    **Pokračovat** nechte vypnuté, jinak by report mohly odeslat další routy.

    ===== Krok 4: Ověřte routu =====

    Vytvořte **Testovací notifikaci** typu ''vps.oom_report'':

    <code json>
    {
      "vps_id": 123,
      "vps_hostname": "example-vps",
      "oom_report_id": 987,
      "cgroup": "/user.slice/user-1000.slice/session-2.scope",
      "count": 1,
      "oom_count": 1,
      "killed_name": "worker"
    }
    </code>

    Pokud je ztlumující routa první shodou a žádná jiná routa nepřipraví
    doručení, test musí oznámit, že žádná povolená routa doručení nevytvořila.
    V **Historii doručování** se takový kandidát nesmí objevit.
- language: cs
  page: navody:notifikace:ztlumeni_incidentu
  body: |
    <page>manuals:notifications:mute_incidents</page>
    ====== Ztlumení vybraných incidentních reportů ======

    Tento příklad ztlumí incidenty s kódovým označením ''abuse-feed'' pro VPS s ID
    ''123''. Ostatní incidenty se nezmění. Použije se vestavěný příjemce
    **Ztlumit**.

    Nejprve si přečtěte [[navody:notifikace|přehled notifikačního systému]],
    [[navody:notifikace:udalosti|události]], [[navody:notifikace:routovani|routování]]
    a [[navody:notifikace:cile_a_prijemci|cíle a příjemce]].

    ===== Krok 1: Určete incident =====

    V historii doručování otevřete odpovídající ''vps.incident_report''.
    Zkopírujte pole ''vps_id'' a ''codename''. ''codename'' je stabilní
    označení zdroje incidentu, nikoli zobrazený předmět nebo text reportu.

    ===== Krok 2: Vytvořte ztlumující routu =====

    V <vpsadmin-nav id="notifications.routes.open">**Notifikace →
    Routy**</vpsadmin-nav> zvolte **Přidat routu**:

    ^ Pole ^ Hodnota ^
    | Název | ''Ztlumit incidentní zdroj pro VPS'' |
    | Typ události | ''vps.incident_report'' |
    | Příjemce | Ztlumit |
    | Povoleno | ano |
    | Pokračovat | ne |

    Routu uložte.

    ===== Krok 3: Přidejte obě podmínky =====

    Přidejte:

    ^ Pole ^ Operátor ^ Hodnota ^
    | ''vps_id'' | rovná se | ''123'' |
    | ''codename'' | rovná se | ''abuse-feed'' |

    {{:cs:screenshots:vpsadmin:notifications:example-mute-incident-route.png?900|Ztlumení incidentů podle ID VPS a kódového označení}}

    **Pokračovat** nechte vypnuté, aby se odpovídající incident dále nesměroval.

    ===== Krok 4: Ověřte routu =====

    Vytvořte **Testovací notifikaci** typu ''vps.incident_report'':

    <code json>
    {
      "subject": "Documentation incident",
      "text": "Synthetic incident used to test routing.",
      "codename": "abuse-feed",
      "vps_id": 123
    }
    </code>

    Pokud je nová ztlumující routa první shodou a žádná jiná routa nepřipraví
    doručení, test musí oznámit, že žádná povolená routa doručení nevytvořila.
    V **Historii doručování** se takový kandidát nesmí objevit.
- language: cs
  page: navody:notifikace:telegram
  body: |
    <page>manuals:notifications:telegram</page>
    ====== Odeslání monitoringu a incidentů do Telegramu ======

    Tento příklad posílá všechny události ''monitoring.*'' a
    ''vps.incident_report'' do soukromého chatu v Telegramu a zároveň zachová běžné
    e-mailové doručení.

    Nejprve si přečtěte [[navody:notifikace|přehled notifikačního systému]],
    [[navody:notifikace:udalosti|události]], [[navody:notifikace:routovani|routování]]
    a [[navody:notifikace:cile_a_prijemci|cíle a příjemce]].

    ===== Krok 1: Spárujte telegramový cíl =====

    V <vpsadmin-nav id="notifications.target-form.open">**Notifikace →
    Cíle**</vpsadmin-nav> přidejte cíl typu **Telegram** s názvem **Provozní
    Telegram**.

    Zobrazený párovací odkaz otevřete v soukromém chatu s botem, stiskněte
    **Start** a vraťte se do vpsAdminu. Cíl musí mít stav **spárováno**. Párovací
    odkaz je tajný a neposílejte jej dalším lidem.

    {{:cs:screenshots:vpsadmin:notifications:example-telegram-target.png?900|Spárovaný telegramový cíl}}

    ===== Krok 2: Vytvořte příjemce =====

    V <vpsadmin-nav id="notifications.receiver-form.open">**Notifikace →
    Příjemci**</vpsadmin-nav> vytvořte **Provozní Telegram**. Otevřete jej a
    připojte spárovaný cíl stejného názvu.

    {{:cs:screenshots:vpsadmin:notifications:example-telegram.png?900|Telegramový cíl připojený k příjemci}}

    ===== Krok 3: Směrujte monitoring =====

    V <vpsadmin-nav id="notifications.routes.open">**Notifikace →
    Routy**</vpsadmin-nav> přidejte:

    ^ Pole ^ Hodnota ^
    | Název | ''Monitoring do Telegramu'' |
    | Typ události | ponechte prázdný |
    | Vzor typu události | ''monitoring.*'' |
    | Příjemce | Provozní Telegram |
    | Povoleno | ano |
    | Pokračovat | ano |

    {{:cs:screenshots:vpsadmin:notifications:example-telegram-monitoring-route.png?900|Telegramová routa pro monitoring.*}}

    ===== Krok 4: Směrujte incidentní reporty =====

    Přidejte další routu:

    ^ Pole ^ Hodnota ^
    | Název | ''Incidenty do Telegramu'' |
    | Typ události | ''vps.incident_report'' |
    | Vzor typu události | ponechte prázdný |
    | Příjemce | Provozní Telegram |
    | Povoleno | ano |
    | Pokračovat | ano |

    {{:cs:screenshots:vpsadmin:notifications:example-telegram-incident-route.png?900|Telegramová routa pro incidentní reporty}}

    **Pokračovat** zůstává zapnuté, aby stejné události nadále chodily i e-mailem.

    ===== Krok 5: Ověřte doručení do Telegramu =====

    Pro bezpečný test spojení dočasně přidejte routu pro přesný typ
    ''user.test_notification'', příjemce **Provozní Telegram** a **Pokračovat:
    ne**. Vytvořte testovací notifikaci, zkontrolujte zprávu v Telegramu a dočasnou
    routu smažte.

    {{:cs:screenshots:vpsadmin:notifications:example-telegram-result.png?900|Testovací notifikace zastavená dočasnou telegramovou routou}}

    Příští skutečný monitoring nebo incident zkontrolujte v
    <vpsadmin-nav id="notifications.event-route-matches.open">**Notifikace →
    Historie doručování → detail události**</vpsadmin-nav>. Obecná syntetická
    událost nemusí
    mít reálný monitoringový nebo incidentní objekt, který potřebuje šablona;
    spojení proto testujte dočasnou routou.
- language: cs
  page: navody:notifikace:sms
  body: |
    <page>manuals:notifications:sms</page>
    ====== Odeslání SMS při pozastavení účtu nebo VPS ======

    Tento příklad pošle SMS při pozastavení celého účtu nebo jednotlivé VPS a
    zároveň zachová běžné e-mailové notifikace.

    Nejprve si přečtěte [[navody:notifikace|přehled notifikačního systému]],
    [[navody:notifikace:udalosti|události]], [[navody:notifikace:routovani|routování]]
    a [[navody:notifikace:cile_a_prijemci|cíle a příjemce]].

    ===== Krok 1: Přidejte a ověřte SMS cíl =====

    V <vpsadmin-nav id="notifications.target-form.open">**Notifikace →
    Cíle**</vpsadmin-nav> přidejte cíl typu **SMS**. Číslo zadejte v mezinárodním
    formátu E.164, například ''+420123456789'', a uložte jej.

    Odešlete ověřovací SMS a zapište přijatý kód. Zprávy může přijímat pouze
    povolený a ověřený cíl.

    {{:cs:screenshots:vpsadmin:notifications:example-sms-verification.png?900|Ověření SMS cíle přijatým kódem}}

    ===== Krok 2: Vytvořte příjemce =====

    V <vpsadmin-nav id="notifications.receiver-form.open">**Notifikace →
    Příjemci**</vpsadmin-nav> vytvořte **SMS pozastavení**. Otevřete jej a připojte
    ověřený SMS cíl.

    {{:cs:screenshots:vpsadmin:notifications:example-sms.png?900|Ověřený SMS cíl připojený k příjemci}}

    ===== Krok 3: Směrujte pozastavení účtu =====

    V <vpsadmin-nav id="notifications.routes.open">**Notifikace →
    Routy**</vpsadmin-nav> přidejte:

    ^ Pole ^ Hodnota ^
    | Název | ''SMS při pozastavení účtu'' |
    | Typ události | ''user.suspended'' |
    | Příjemce | SMS pozastavení |
    | Povoleno | ano |
    | Pokračovat | ano |

    {{:cs:screenshots:vpsadmin:notifications:example-sms-account-route.png?900|SMS routa pro pozastavení účtu}}

    ===== Krok 4: Směrujte pozastavení VPS =====

    Přidejte:

    ^ Pole ^ Hodnota ^
    | Název | ''SMS při pozastavení VPS'' |
    | Typ události | ''vps.suspended'' |
    | Příjemce | SMS pozastavení |
    | Povoleno | ano |
    | Pokračovat | ano |

    {{:cs:screenshots:vpsadmin:notifications:example-sms-vps-route.png?900|SMS routa pro pozastavení VPS}}

    ''user.suspended'' se týká celého účtu a ''vps.suspended'' jedné VPS.
    **Pokračovat** nechte zapnuté, aby zůstalo zachováno e-mailové doručení.

    ===== Krok 5: Otestujte a zkontrolujte doručení =====

    Volitelně vytvořte testovací událost ''user.suspended'':

    <code json>
    {
      "state": "suspended",
      "reason": "Routing test"
    }
    </code>

    Test nic nepozastaví, ale odešle skutečnou SMS, která může být zpoplatněna.

    {{:cs:screenshots:vpsadmin:notifications:example-sms-result.png?900|Test pozastavení účtu odpovídající SMS routě}}

    Výsledek zkontrolujte v
    <vpsadmin-nav id="notifications.event-route-matches.open">**Notifikace →
    Historie doručování → detail události**</vpsadmin-nav>. Routa VPS se ověří
    při příštím
    skutečném pozastavení, protože obecný test není spojen s reálnou VPS potřebnou
    šablonou zprávy.
- language: cs
  page: navody:notifikace:webhook
  body: |
    <page>manuals:notifications:webhook</page>
    ====== Odeslání změn prostředků VPS na webhook ======

    Tento příklad posílá podepsaný JSON na HTTPS endpoint při každé události
    ''vps.resources_changed''. Formát podporuje jednotlivé i seskupené notifikace.

    Nejprve si přečtěte [[navody:notifikace|přehled notifikačního systému]],
    [[navody:notifikace:udalosti|události]], [[navody:notifikace:routovani|routování]]
    a [[navody:notifikace:cile_a_prijemci|cíle a příjemce]].

    ===== Krok 1: Vytvořte webhookový cíl =====

    V bezpečném prostředí vytvořte tajemství příkazem ''openssl rand -hex 32''
    a bezpečně je uložte.

    V <vpsadmin-nav id="notifications.target-form.open">**Notifikace →
    Cíle**</vpsadmin-nav> přidejte typ **Webhook**. Zadejte veřejnou URL, například
    ''https://events.example.net/vpsadmin'', a stejné tajemství. vpsAdmin odmítá
    privátní, lokální, link-local a jiné nebezpečné cílové adresy.

    {{:cs:screenshots:vpsadmin:notifications:example-webhook-target.png?900|Webhookový cíl s veřejnou URL a HMAC tajemstvím}}

    ===== Krok 2: Vytvořte příjemce =====

    V <vpsadmin-nav id="notifications.receiver-form.open">**Notifikace →
    Příjemci**</vpsadmin-nav> vytvořte **Webhook změn prostředků** a připojte k
    němu nový webhookový cíl.

    {{:cs:screenshots:vpsadmin:notifications:example-webhook.png?900|Webhookový cíl připojený k příjemci}}

    ===== Krok 3: Vytvořte routu =====

    V <vpsadmin-nav id="notifications.routes.open">**Notifikace →
    Routy**</vpsadmin-nav> přidejte:

    ^ Pole ^ Hodnota ^
    | Název | ''Webhook změn prostředků VPS'' |
    | Typ události | ''vps.resources_changed'' |
    | Příjemce | Webhook změn prostředků |
    | Povoleno | ano |
    | Pokračovat | ano |

    {{:cs:screenshots:vpsadmin:notifications:example-webhook-route.png?900|Webhooková routa pro změny prostředků VPS}}

    ===== Krok 4: Připravte jednoduchý přijímací server =====

    Následující kód uložte jako ''webhook_server.py''. Ověří podpis HMAC z přesného těla
    požadavku, porovná ID doručení a vypíše všechny přijaté události:

    <kb-code-sample id="notifications.webhook-server" />

    Spusťte jej za veřejnou HTTPS reverzní proxy:

    <code>
    export WEBHOOK_SECRET='vložte stejné tajemství jako ve vpsAdminu'
    python3 webhook_server.py
    </code>

    Server naslouchá pouze na ''127.0.0.1:8080''; URL
    nastavená ve vpsAdminu musí být veřejná a používat HTTPS.

    ===== Krok 5: Ověřte webhook =====

    Pro tento test dočasně vypněte **Pokračovat**. Syntetická událost se tak
    nedostane k výchozím šablonám, které potřebují reálnou VPS. Vytvořte testovací
    událost ''vps.resources_changed'':

    <code json>
    {
      "vps_id": 123,
      "vps_hostname": "example-vps",
      "cpu": 4,
      "cpu_limit": 400,
      "memory": 8192,
      "swap": 2048,
      "reason": "Memory upgrade"
    }
    </code>

    Server přijme ''Content-Type: application/json'', ''User-Agent: vpsAdmin
    notification dispatcher'', ''X-VpsAdmin-Delivery'' a
    ''X-VpsAdmin-Signature-256''. U doručení jediné události je přítomna také
    hlavička ''X-VpsAdmin-Event''. Seskupený požadavek má místo ní
    ''X-VpsAdmin-Group'' a v poli ''events'' může obsahovat více událostí.

    Odpovídající routu zkontrolujte v
    <vpsadmin-nav id="notifications.event-route-matches.open">**Notifikace →
    Historie doručování → detail události**</vpsadmin-nav> a poté znovu zapněte
    **Pokračovat**.

    {{:cs:screenshots:vpsadmin:notifications:example-webhook-result.png?900|Test změny prostředků zastavený webhookovou routou}}

    ===== Co server přijme =====

    ID a čas v tomto zkráceném příkladu jsou pouze ilustrační:

    <kb-code-sample id="notifications.webhook-single-payload" />

    Podpis je HMAC-SHA256 z nezměněných bajtů těla a má tvar
    ''sha256=<HMAC>''. Libovolná odpověď ''2xx'' znamená úspěch. Neúspěšné
    doručení se může opakovat, proto je zpracovávejte idempotentně podle podepsané
    hodnoty ''delivery.id'' v těle. Hlavička ''X-VpsAdmin-Delivery'' není sama
    podepsaná; příklad ji přijme pouze při shodě s ''delivery.id''.
- language: en
  page: manuals:notifications
  body: |
    ====== Notifications ======

    The vpsAdmin notification system turns events into e-mail, SMS, Telegram, or
    webhook deliveries. Open it from the
    <vpsadmin-nav id="notifications.open">main **Notifications** menu</vpsadmin-nav>.

    The basic flow is **event → route → receiver → target**:

      * an **event** describes what happened,
      * a **route** selects events and decides whether routing continues,
      * a **receiver** describes who or which integration should be notified,
      * a **target** is a concrete e-mail address, telephone number, Telegram chat, or webhook endpoint.

    Delivery history is not an internal audit log. An event is stored there only
    when routing prepares at least one real delivery. If you need a complete
    external record, create a catch-all route and deliver it to your own durable
    storage, for example through a webhook.

    ===== Read these concepts first =====

      * [[manuals:notifications:events|Events and event types]] explains event contents, event families, and the live catalog.
      * [[manuals:notifications:routing|Event routing and matchers]] explains route order, subroutes, matcher operators, and testing.
      * [[manuals:notifications:targets_and_receivers|Targets and receivers]] explains delivery endpoints and their reusable groups.

    ===== Step-by-step examples =====

    Each example starts from an ordinary account with the default routes. Follow
    one example at a time:

      * [[manuals:notifications:event_roles|Route account and admin events to different contacts]]
      * [[manuals:notifications:mute_oom|Mute selected OOM reports]]
      * [[manuals:notifications:mute_incidents|Mute selected incident reports]]
      * [[manuals:notifications:telegram|Send monitoring events and incident reports to Telegram]]
      * [[manuals:notifications:sms|Send SMS on account or VPS suspension]]
      * [[manuals:notifications:webhook|Send VPS resource changes to a webhook]]

    ===== Advanced options =====

    <vpsadmin-nav id="notifications.route-grouping-form.open">Grouping on a
    route</vpsadmin-nav> collects related events into one summary; the
    <vpsadmin-nav id="notifications.groups.open">notification-group list</vpsadmin-nav>
    shows pending and historical summaries. Create a reusable schedule under
    <vpsadmin-nav id="notifications.time-intervals.open">**Notifications → Time
    intervals**</vpsadmin-nav>, then attach it as an active or mute interval in
    the <vpsadmin-nav id="notifications.route-time-intervals.open">route's time
    interval settings</vpsadmin-nav>.

    Inspect prepared deliveries and matched routes at
    <vpsadmin-nav id="notifications.event-route-matches.open">**Notifications →
    Delivery history → event detail**</vpsadmin-nav>.
- language: en
  page: manuals:notifications:events
  body: |
    <page>navody:notifikace:udalosti</page>
    ====== Events and event types ======

    An **event** is a structured message describing something that happened in
    vpsAdmin. It can report a login, a VPS state change, an OOM report, an
    incident, a monitoring problem, or a completed operation. Every event has
    an **event type** (for example ''vps.oom_report''), a severity, and a set of
    named fields.

    An event type describes possible events; it is not one particular event.
    It defines the default severity, whether default routes deliver the type,
    and which fields can be used by matchers. Open the current catalog at
    <vpsadmin-nav id="notifications.event-types.open">**Notifications → Event
    types**</vpsadmin-nav>.

    {{:en:screenshots:vpsadmin:notifications:event-types.png?900|Categories in the current event-type catalog}}

    ===== Event families =====

    The catalog evolves together with vpsAdmin, so **Event types** is more
    accurate than a fixed list in this documentation. Types are grouped into
    families:

      * **account and security** — account lifecycle, logins, tokens, TOTP, and expiration notices,
      * **VPS** — lifecycle, resource and network changes, console access, OOM reports, and prevention,
      * **monitoring, incidents, and outages** — detected problems and reports concerning your services,
      * **storage and migration** — dataset changes, snapshots, prepared downloads, and moves,
      * **operations and resource changes** — operation progress and typed object changes such as ''vps.updated'',
      * **requests and payments** — user-request changes and payment events,
      * **system** — progress of user-started operations; internal vpsAdmin operational types are administrator-only and remain hidden.

    An ordinary account sees only event types it can meaningfully use in its
    routes. Internal infrastructure event types remain hidden.

    ===== Event fields =====

    Every type has common fields such as ''event_type'', ''severity'',
    ''subject'', ''summary'', ''roles'', and ''default_routed'', and can add
    fields of its own. For example, ''vps.oom_report'' includes ''vps_id'',
    ''vps_hostname'', ''cgroup'', ''oom_count'', and ''killed_name''.

    The type detail shows each field's data type, example value, and meaning.
    The matcher form offers only operators appropriate for that data type.

    {{:en:screenshots:vpsadmin:notifications:event-type-vps-oom-report.png?900|Fields of the vps.oom_report event type}}

    The ''roles'' field controls default role-based routing; it is not an access
    permission. An account-owned type can therefore appear in an ordinary
    user's catalog even when its delivery role is ''admin''. One event can also
    have both ''account'' and ''admin'' roles.

    ===== When an event appears in history =====

    <vpsadmin-nav id="notifications.event-route-matches.open">**Notifications →
    Delivery history → event detail**</vpsadmin-nav> is not a complete audit log.
    A candidate is stored only when routing prepares at least one real
    delivery. If every matching route only mutes the event or skips its
    receiver because of an active or mute interval, and no other route or
    subroute produces a delivery, the event does not appear in history. An
    event without a matching route does not appear either.

    Continue with [[manuals:notifications:routing|Event routing and matchers]].

- language: en
  page: manuals:notifications:routing
  body: |
    <page>navody:notifikace:routovani</page>
    ====== Event routing and matchers ======

    A **route** is a rule that decides whether an event should be passed to a
    particular receiver. It contains an event-type selection, zero or more
    matchers, a receiver, and the **Continue** behavior. Manage routes at
    <vpsadmin-nav id="notifications.routes.open">**Notifications → Routes**</vpsadmin-nav>.

    {{:en:screenshots:vpsadmin:notifications:routes.png?900|Basic list with one custom route and the default routes}}

    ===== How routes are evaluated =====

      - vpsAdmin starts with root routes and evaluates siblings from top to bottom.
      - A route matches only when its event-type selection and **all** matchers match. Matchers on one route therefore use logical **AND**.
      - After a match, active and mute intervals decide whether this route's receiver is processed. Intervals do not change whether the route matched and do not prevent its subroutes from being evaluated.
      - Matching subroutes are evaluated after the match even when an interval skipped the parent route's receiver.
      - **Continue: yes** permits later sibling routes at the same level. **Continue: no** stops later siblings at that level.

    After a parent matches, its subroutes are evaluated regardless of the
    parent's **Continue** setting. That setting controls siblings, not entry
    into the subroute branch.

    Default routes use the ''default_routed'' and ''roles'' fields. Custom
    routes precede them, so they can redirect or mute selected events first. A
    mute route usually uses the built-in **Mute** receiver and **Continue: no**.

    ===== Selecting event types =====

      * **Event type** selects one exact type, such as ''vps.oom_report''.
      * **Event type pattern** uses a glob such as ''monitoring.*''.
      * If both fields are empty, the route can match every event type.

    An exact-type route can use common fields and fields specific to that type.
    A pattern or catch-all route can use only common fields. Check the available
    types and fields in the [[manuals:notifications:events|event-type catalog]].

    ===== Matchers and operators =====

    A **matcher** compares one event field with a value. Add it from the detail
    of a saved route. Open the form at
    <vpsadmin-nav id="notifications.matcher-form.open">**Notifications → Routes
    → edit route → Add matcher**</vpsadmin-nav>.

    Available operators depend on the field's data type:

    ^ Field type ^ Operators ^ Meaning ^
    | text | ''=='', ''!='' | equal and not equal |
    | text | ''=~'', ''!~'' | matches or does not match a regular expression |
    | text | ''=*'', ''!*'' | matches or does not match a glob; ''*'' matches a part and ''**'' matches multiple path levels |
    | integer, number, or date and time | ''=='', ''!='', ''>'', ''>='', ''<'', ''<='' | numeric or time comparison |
    | boolean | ''=='', ''!='' | compare ''true'' or ''false'' |
    | list of text or numbers | ''contains'', ''not_contains'' | list contains or does not contain an item |

    For example, ''cgroup =* /user.slice/**/*.scope'' selects OOM reports from
    user sessions. A second matcher, ''vps_id == 123'', restricts the same route
    to one VPS; both must match.

    {{:en:screenshots:vpsadmin:notifications:matcher-form.png?900|cgroup matcher form and the operator reference}}

    ===== Testing routing =====

    At <vpsadmin-nav id="notifications.test-notification.open">**Notifications
    → Test notification**</vpsadmin-nav>, choose a type and enter JSON values for
    its fields. A test uses real routing and real targets, so it can actually
    send e-mail, SMS, Telegram, or a webhook. It does not perform an underlying
    operational action such as suspending a VPS.

    If no enabled route prepares a delivery, the test fails and the event is
    not stored. Inspect a successful result in the Delivery history detail.

    See also [[manuals:notifications:targets_and_receivers|Targets and receivers]]
    and the recipes in the [[manuals:notifications|notifications overview]].

- language: en
  page: manuals:notifications:targets_and_receivers
  body: |
    <page>navody:notifikace:cile_a_prijemci</page>
    ====== Targets and receivers ======

    A route does not send an event directly to an address. It points to a
    **receiver**, which contains one or more **targets**:

      * a **target** is a concrete delivery endpoint such as an e-mail address, telephone number, Telegram chat, or webhook URL,
      * a **receiver** is a named group of targets that can be reused by several routes.

    One event passed to a receiver prepares delivery for each of its enabled
    targets. The same target can be attached to several receivers, and targets
    can change without rewriting routes.

    ===== Targets =====

    Open the list at
    <vpsadmin-nav id="notifications.targets.open">**Notifications → Targets**</vpsadmin-nav>.
    It shows each target's delivery method, endpoint, enabled state, and
    verification state.

    {{:en:screenshots:vpsadmin:notifications:targets.png?900|List of notification targets}}

    When adding or editing a target at
    <vpsadmin-nav id="notifications.target-form.open">**Notifications → Targets
    → add or edit target**</vpsadmin-nav>, choose one delivery method:

      * **E-mail** can use the account address or a custom address. A custom address must be verified through a link in the verification message.
      * **SMS** uses an E.164 international telephone number and requires a verification code before delivery.
      * **Telegram** is paired with a particular chat using a one-time pairing command.
      * **Webhook** sends JSON to a public HTTP(S) URL. An optional secret signs the exact body in the ''X-VpsAdmin-Signature-256'' header.

    A disabled, unverified, or unpaired target receives nothing. Globally
    disabling one delivery method also pauses all targets of that type.

    ===== Receivers =====

    Create a receiver at
    <vpsadmin-nav id="notifications.receivers.open">**Notifications →
    Receivers**</vpsadmin-nav>. Give it a purpose-oriented name such as
    **On-call** or **Resource-change webhook**.

    After opening it at
    <vpsadmin-nav id="notifications.receiver-form.open">**Notifications →
    Receivers → edit receiver**</vpsadmin-nav>, you can change its description,
    enabled state, and attached targets.

    {{:en:screenshots:vpsadmin:notifications:receiver.png?900|Receiver settings and its targets table}}

    Disabling a receiver stops all delivery through it without changing its
    routes. A receiver with multiple targets fans out delivery, for example to
    e-mail and Telegram at the same time.

    The built-in **Mute** receiver is special: it has no delivery endpoint and
    suppresses the matching event. It is used by mute routes, normally with
    **Continue** disabled.

    Continue with [[manuals:notifications:routing|Event routing]] or choose a
    practical procedure from the [[manuals:notifications|notifications overview]].

- language: en
  page: manuals:notifications:event_roles
  body: |
    ====== Route events by account or admin role ======

    Event roles are labels used by the default routes and available to match in
    custom routes. They do not decide which event types a user sees in the
    catalog, grant vpsAdmin permissions, or correspond to a user's access role.

    The ''account'' role covers membership and account lifecycle, payments and
    billing, requests, and security notices intended for the account owner or an
    accountant. The ''admin'' role covers VPS operation, monitoring, OOM and
    incident reports, backups, and migrations normally routed to a technical
    administrator. A type with the ''admin'' role can still be visible to an
    ordinary account and usable in its routes when the type concerns its
    resources. Check **Event types** for each concrete type's roles. An event can
    have both roles, in which case both contacts receive it.

    Before starting, read the [[manuals:notifications|notification system overview]],
    [[manuals:notifications:events|events]], [[manuals:notifications:routing|routing]],
    and [[manuals:notifications:targets_and_receivers|targets and receivers]].

    ===== Step 1: Create and verify two e-mail targets =====

    At <vpsadmin-nav id="notifications.target-form.open">**Notifications →
    Targets**</vpsadmin-nav>, add two e-mail targets. Give them descriptive labels,
    for example **Account e-mail** and **Administrator e-mail**. Open the link in
    each verification message before continuing.

    ===== Step 2: Create two receivers =====

    At <vpsadmin-nav id="notifications.receiver-form.open">**Notifications →
    Receivers**</vpsadmin-nav>, create **Account contact**. Open it and add the
    verified **Account e-mail** target.

    Create **Administrator contact** in the same way and add **Administrator
    e-mail**.

    {{:en:screenshots:vpsadmin:notifications:example-role-receiver.png?900|E-mail target attached to the Account contact receiver}}

    ===== Step 3: Add the account-role route =====

    At <vpsadmin-nav id="notifications.routes.open">**Notifications →
    Routes**</vpsadmin-nav>, select **Add route** and set:

    ^ Field ^ Value ^
    | Label | ''Account-role notifications'' |
    | Event type | leave empty |
    | Event type pattern | leave empty |
    | Receiver | Account contact |
    | Enabled | yes |
    | Continue | yes |

    Save the route. On its detail, select **Add matcher** and set:

    ^ Matcher setting ^ Value ^
    | Event type | Any event type |
    | Field | ''roles'' |
    | Operator | contains list item |
    | Value | ''account'' |

    {{:en:screenshots:vpsadmin:notifications:example-role-routing.png?900|Account-role route with its roles matcher}}

    ===== Step 4: Add the admin-role route =====

    Repeat Step 3 with label **Admin-role notifications**, receiver
    **Administrator contact**, and matcher value ''admin''. Keep **Continue**
    enabled.

    {{:en:screenshots:vpsadmin:notifications:example-role-admin-route.png?900|Admin-role route with its roles matcher}}

    Because both routes have **Continue** enabled, an event with both roles
    reaches both contacts and can still reach later routes.

    ===== Step 5: Test the result =====

    Create a **Test notification** of type ''vps.suspended''. This type has both
    the
    ''account'' and ''admin'' roles. For example, use:

    <code json>
    {
      "vps_id": 123,
      "vps_hostname": "example-vps",
      "state": "suspended",
      "reason": "Role routing test"
    }
    </code>

    These values are only test-event content; no real VPS is suspended. The
    example deliberately omits the ''roles'' item. To test the selected type's
    default roles, leave it out; an explicit value would override them in the
    test event.

    Open the created event at
    <vpsadmin-nav id="notifications.event-route-matches.open">**Notifications →
    Delivery history → event detail**</vpsadmin-nav>. Both new routes must appear
    in its
    matched-routes table. Test notifications perform real deliveries, so both
    verified
    addresses should receive the message.

    {{:en:screenshots:vpsadmin:notifications:example-role-result.png?900|Test notification matching both role routes}}
- language: en
  page: manuals:notifications:mute_oom
  body: |
    ====== Mute selected OOM reports ======

    This example mutes OOM reports from user-session cgroups on VPS ID ''123'',
    while leaving other OOM reports unchanged. It uses the built-in **Mute**
    receiver, so no target or receiver has to be created.

    Before starting, read the [[manuals:notifications|notification system overview]],
    [[manuals:notifications:events|events]], [[manuals:notifications:routing|routing]],
    and [[manuals:notifications:targets_and_receivers|targets and receivers]].

    ===== Step 1: Find values from a real OOM report =====

    Open a relevant ''vps.oom_report'' in delivery history and note its
    ''vps_id'' and ''cgroup'' fields. The cgroup is a complete path without the
    ''/sys/fs/cgroup'' prefix, for example
    ''/user.slice/user-1000.slice/session-2.scope''.

    ===== Step 2: Create the mute route =====

    At <vpsadmin-nav id="notifications.routes.open">**Notifications →
    Routes**</vpsadmin-nav>, select **Add route** and set:

    ^ Field ^ Value ^
    | Label | ''Mute selected OOM reports'' |
    | Event type | ''vps.oom_report'' |
    | Receiver | Mute |
    | Enabled | yes |
    | Continue | no |

    Save the route.

    ===== Step 3: Add both matchers =====

    Add these matchers to the saved route:

    ^ Field ^ Operator ^ Value ^
    | ''vps_id'' | equals | ''123'' |
    | ''cgroup'' | matches glob | %%/user.slice/**/*.scope%% |

    All matchers on a route must match. In this glob, %%**%% can span several
    directory levels.

    {{:en:screenshots:vpsadmin:notifications:example-mute-oom.png?900|OOM-report mute route with VPS and cgroup matchers}}

    Keep **Continue** disabled, otherwise another route could still send the
    report.

    ===== Step 4: Test the route =====

    Create a **Test notification** of type ''vps.oom_report'' with
    representative fields:

    <code json>
    {
      "vps_id": 123,
      "vps_hostname": "example-vps",
      "oom_report_id": 987,
      "cgroup": "/user.slice/user-1000.slice/session-2.scope",
      "count": 1,
      "oom_count": 1,
      "killed_name": "worker"
    }
    </code>

    If the mute route is the first match and no other route prepares a delivery,
    the test must report that no enabled route produced a delivery. The
    candidate must not appear in **Delivery history**.
- language: en
  page: manuals:notifications:mute_incidents
  body: |
    ====== Mute selected incident reports ======

    This example mutes incident reports with codename ''abuse-feed'' for VPS ID
    ''123'', while leaving other incident reports unchanged. It uses the built-in
    **Mute** receiver.

    Before starting, read the [[manuals:notifications|notification system overview]],
    [[manuals:notifications:events|events]], [[manuals:notifications:routing|routing]],
    and [[manuals:notifications:targets_and_receivers|targets and receivers]].

    ===== Step 1: Identify the incident =====

    Open a relevant ''vps.incident_report'' in delivery history. Copy its
    ''vps_id'' and ''codename'' fields. The codename is the stable identifier of
    the incident source; it is not the displayed subject or report text.

    ===== Step 2: Create the mute route =====

    At <vpsadmin-nav id="notifications.routes.open">**Notifications →
    Routes**</vpsadmin-nav>, select **Add route** and set:

    ^ Field ^ Value ^
    | Label | ''Mute incident feed for VPS'' |
    | Event type | ''vps.incident_report'' |
    | Receiver | Mute |
    | Enabled | yes |
    | Continue | no |

    Save the route.

    ===== Step 3: Add both matchers =====

    Add:

    ^ Field ^ Operator ^ Value ^
    | ''vps_id'' | equals | ''123'' |
    | ''codename'' | equals | ''abuse-feed'' |

    {{:en:screenshots:vpsadmin:notifications:example-mute-incident-route.png?900|Incident mute route with VPS ID and codename matchers}}

    Keep **Continue** disabled so the matching incident is not routed further.

    ===== Step 4: Test the route =====

    Create a **Test notification** of type ''vps.incident_report'':

    <code json>
    {
      "subject": "Documentation incident",
      "text": "Synthetic incident used to test routing.",
      "codename": "abuse-feed",
      "vps_id": 123
    }
    </code>

    If the new mute route is the first match and no other route prepares a
    delivery, the test must report that no enabled route produced a delivery.
    The candidate must not appear in **Delivery history**.
- language: en
  page: manuals:notifications:telegram
  body: |
    ====== Send monitoring and incident events to Telegram ======

    This example sends all ''monitoring.*'' events and all
    ''vps.incident_report'' events to a private Telegram chat while preserving
    normal e-mail delivery.

    Before starting, read the [[manuals:notifications|notification system overview]],
    [[manuals:notifications:events|events]], [[manuals:notifications:routing|routing]],
    and [[manuals:notifications:targets_and_receivers|targets and receivers]].

    ===== Step 1: Pair a Telegram target =====

    At <vpsadmin-nav id="notifications.target-form.open">**Notifications →
    Targets**</vpsadmin-nav>, add a **Telegram** target named **Operations
    Telegram**.

    Open the displayed pairing link in a private chat with the bot, press **Start**,
    and return to vpsAdmin. The target must show **paired**. Treat the pairing link
    as a secret and do not share it.

    {{:en:screenshots:vpsadmin:notifications:example-telegram-target.png?900|Paired Telegram target}}

    ===== Step 2: Create a receiver =====

    At <vpsadmin-nav id="notifications.receiver-form.open">**Notifications →
    Receivers**</vpsadmin-nav>, create **Operations Telegram**. Open it and attach
    the paired target with the same name.

    {{:en:screenshots:vpsadmin:notifications:example-telegram.png?900|Telegram target attached to its receiver}}

    ===== Step 3: Route monitoring events =====

    At <vpsadmin-nav id="notifications.routes.open">**Notifications →
    Routes**</vpsadmin-nav>, add:

    ^ Field ^ Value ^
    | Label | ''Monitoring to Telegram'' |
    | Event type | leave empty |
    | Event type pattern | ''monitoring.*'' |
    | Receiver | Operations Telegram |
    | Enabled | yes |
    | Continue | yes |

    {{:en:screenshots:vpsadmin:notifications:example-telegram-monitoring-route.png?900|Telegram route for monitoring.*}}

    ===== Step 4: Route incident reports =====

    Add another route:

    ^ Field ^ Value ^
    | Label | ''Incident reports to Telegram'' |
    | Event type | ''vps.incident_report'' |
    | Event type pattern | leave empty |
    | Receiver | Operations Telegram |
    | Enabled | yes |
    | Continue | yes |

    {{:en:screenshots:vpsadmin:notifications:example-telegram-incident-route.png?900|Telegram route for incident reports}}

    **Continue** remains enabled so the same events can still be delivered by
    e-mail.

    ===== Step 5: Test Telegram delivery =====

    For a safe connection test, temporarily add a route for exact event type
    ''user.test_notification'', receiver **Operations Telegram**, and **Continue:
    no**. Create a test notification, check the Telegram message, and delete the
    temporary route.

    {{:en:screenshots:vpsadmin:notifications:example-telegram-result.png?900|Test notification stopped by the temporary Telegram route}}

    Inspect the next real monitoring or incident event at
    <vpsadmin-nav id="notifications.event-route-matches.open">**Notifications →
    Delivery history → event detail**</vpsadmin-nav>. A generic synthetic event
    may lack
    the real monitoring or incident object required by its message template, so
    use the temporary test route to test the connection itself.
- language: en
  page: manuals:notifications:sms
  body: |
    ====== Send SMS on account or VPS suspension ======

    This example sends SMS when the whole account or an individual VPS is
    suspended, while preserving normal e-mail notifications.

    Before starting, read the [[manuals:notifications|notification system overview]],
    [[manuals:notifications:events|events]], [[manuals:notifications:routing|routing]],
    and [[manuals:notifications:targets_and_receivers|targets and receivers]].

    ===== Step 1: Add and verify an SMS target =====

    At <vpsadmin-nav id="notifications.target-form.open">**Notifications →
    Targets**</vpsadmin-nav>, add an **SMS** target. Enter the telephone number in
    international E.164 format, for example ''+420123456789'', and save it.

    Send the verification SMS and enter the received code. Only an enabled,
    verified target can receive notifications.

    {{:en:screenshots:vpsadmin:notifications:example-sms-verification.png?900|Verifying an SMS target with its code}}

    ===== Step 2: Create a receiver =====

    At <vpsadmin-nav id="notifications.receiver-form.open">**Notifications →
    Receivers**</vpsadmin-nav>, create **Suspension SMS**. Open it and attach the
    verified SMS target.

    {{:en:screenshots:vpsadmin:notifications:example-sms.png?900|Verified SMS target attached to its receiver}}

    ===== Step 3: Route account suspensions =====

    At <vpsadmin-nav id="notifications.routes.open">**Notifications →
    Routes**</vpsadmin-nav>, add:

    ^ Field ^ Value ^
    | Label | ''Account suspension SMS'' |
    | Event type | ''user.suspended'' |
    | Receiver | Suspension SMS |
    | Enabled | yes |
    | Continue | yes |

    {{:en:screenshots:vpsadmin:notifications:example-sms-account-route.png?900|SMS route for account suspension}}

    ===== Step 4: Route VPS suspensions =====

    Add:

    ^ Field ^ Value ^
    | Label | ''VPS suspension SMS'' |
    | Event type | ''vps.suspended'' |
    | Receiver | Suspension SMS |
    | Enabled | yes |
    | Continue | yes |

    {{:en:screenshots:vpsadmin:notifications:example-sms-vps-route.png?900|SMS route for VPS suspension}}

    ''user.suspended'' concerns the whole account, while ''vps.suspended'' concerns
    one VPS. Keep **Continue** enabled so e-mail delivery remains active.

    ===== Step 5: Test and inspect delivery =====

    Optionally create a ''user.suspended'' test notification with:

    <code json>
    {
      "state": "suspended",
      "reason": "Routing test"
    }
    </code>

    The test suspends nothing, but sends a real SMS and may incur the normal SMS
    charge.

    {{:en:screenshots:vpsadmin:notifications:example-sms-result.png?900|Account suspension test matching the SMS route}}

    Inspect the result at
    <vpsadmin-nav id="notifications.event-route-matches.open">**Notifications →
    Delivery history → event detail**</vpsadmin-nav>. Verify the VPS route on the
    next real
    VPS suspension because a generic test is not attached to the real VPS required
    by its message template.
- language: en
  page: manuals:notifications:webhook
  body: |
    ====== Send VPS resource changes to a webhook ======

    This example sends signed JSON to an HTTPS endpoint for every
    ''vps.resources_changed'' event. The payload supports both individual and
    grouped notifications.

    Before starting, read the [[manuals:notifications|notification system overview]],
    [[manuals:notifications:events|events]], [[manuals:notifications:routing|routing]],
    and [[manuals:notifications:targets_and_receivers|targets and receivers]].

    ===== Step 1: Create the webhook target =====

    Generate a secret in a trusted environment with ''openssl rand -hex 32''
    and store it securely.

    At <vpsadmin-nav id="notifications.target-form.open">**Notifications →
    Targets**</vpsadmin-nav>, add a **Webhook** target. Enter a public URL such as
    ''https://events.example.net/vpsadmin'' and the same secret. vpsAdmin rejects
    private, local, link-local, and otherwise unsafe destination addresses.

    {{:en:screenshots:vpsadmin:notifications:example-webhook-target.png?900|Webhook target with a public URL and HMAC secret}}

    ===== Step 2: Create the receiver =====

    At <vpsadmin-nav id="notifications.receiver-form.open">**Notifications →
    Receivers**</vpsadmin-nav>, create **Resource-change webhook** and attach the
    new webhook target.

    {{:en:screenshots:vpsadmin:notifications:example-webhook.png?900|Webhook target attached to its receiver}}

    ===== Step 3: Create the route =====

    At <vpsadmin-nav id="notifications.routes.open">**Notifications →
    Routes**</vpsadmin-nav>, add:

    ^ Field ^ Value ^
    | Label | ''VPS resource-change webhook'' |
    | Event type | ''vps.resources_changed'' |
    | Receiver | Resource-change webhook |
    | Enabled | yes |
    | Continue | yes |

    {{:en:screenshots:vpsadmin:notifications:example-webhook-route.png?900|Webhook route for VPS resource changes}}

    ===== Step 4: Prepare a simple receiver server =====

    Save this as ''webhook_server.py''. It verifies the HMAC signature over the exact
    request body, checks the delivery ID, and prints every received event:

    <kb-code-sample id="notifications.webhook-server" />

    Run it behind a public HTTPS reverse proxy:

    <code>
    export WEBHOOK_SECRET='paste the same secret configured in vpsAdmin'
    python3 webhook_server.py
    </code>

    The example server listens only on ''127.0.0.1:8080''; the URL configured
    in vpsAdmin must be public HTTPS.

    ===== Step 5: Test the webhook =====

    Temporarily disable **Continue** for this test. This keeps the synthetic event
    away from default templates that require a real VPS. Create a
    ''vps.resources_changed'' test event:

    <code json>
    {
      "vps_id": 123,
      "vps_hostname": "example-vps",
      "cpu": 4,
      "cpu_limit": 400,
      "memory": 8192,
      "swap": 2048,
      "reason": "Memory upgrade"
    }
    </code>

    The server receives ''Content-Type: application/json'', ''User-Agent: vpsAdmin
    notification dispatcher'', ''X-VpsAdmin-Delivery'', and
    ''X-VpsAdmin-Signature-256''. ''X-VpsAdmin-Event'' is present for a
    single-event delivery. A grouped request instead has ''X-VpsAdmin-Group'' and
    can contain several entries in ''events''.

    Inspect the matched route at
    <vpsadmin-nav id="notifications.event-route-matches.open">**Notifications →
    Delivery history → event detail**</vpsadmin-nav>, then re-enable
    **Continue**.

    {{:en:screenshots:vpsadmin:notifications:example-webhook-result.png?900|Resource-change test stopped by the webhook route}}

    ===== What the server receives =====

    IDs and timestamps in this shortened example are illustrative:

    <kb-code-sample id="notifications.webhook-single-payload" />

    The signature is HMAC-SHA256 over the unmodified body bytes and has the form
    ''sha256=<HMAC>''. Any ''2xx'' response is successful. Failed deliveries may
    be retried, so process them idempotently using the signed ''delivery.id'' in
    the body. The ''X-VpsAdmin-Delivery'' header is not itself signed; the example
    accepts it only when it matches ''delivery.id''.
replacements:
- language: cs
  page: navody:vps:uzivatele
  path: notifications.open
  before: |-
    ===== Konfigurace e-mailových adres =====
    vpsAdmin umožňuje nastavit jeden primární e-mail patřící majiteli účtu --
    členovi v našem spolku. Ten musí být nastaven a může být jen jeden. Krom toho je
    možné nastavit různé e-mailové adresy pro různé typy kontaktů -- např. účetní a
    správce VPS. Toto nastavení lze měnit v detailech uživatelského účtu
    (<vpsadmin-nav id="member.edit-profile.open">vpsAdmin -> Upravit profil</vpsadmin-nav>).

    {{:cs:screenshots:vpsadmin:account:email-roles.png?300|}}

    Například, správce členství (role Vedení účtu) dostává následující
    maily:

      * upozornění k platbě členského příspěvku,
      * pozastavení/obnovení členství,
      * potvrzení přijetí platby.

    Správce VPS (role Správce systému) pak maily o:

      * změně stavu VPS,
      * změně konfigurace VPS,
      * stahování záloh,
      * migrace VPS.

    ==== Detailní nastavení ====
    Komu by nestačilo nastavení různých e-mailových adres pro různé role, nebo
    některé e-maily nechce vůbec dostávat, existuje ještě pokročilé nastavení
    (<vpsadmin-nav id="member.advanced-email-configuration.open">vpsAdmin -> Upravit profil -> Pokročilá konfigurace e-mailu</vpsadmin-nav>). Zde si můžete
    nastavit libovolné adresy pro vybrané typy e-mailů, případně zasílání zrušit
    úplně.

    {{:cs:screenshots:vpsadmin:account:mail-template-recipients.png?300|}}
  body: vpsAdmin → Notifikace
  replacement: |-
    ===== E-mailová adresa a notifikace =====
    Primární e-mailová adresa patří majiteli účtu — členovi spolku. Je povinná,
    může být pouze jedna a mění se v nastavení účtu (vpsAdmin → Upravit profil).

    Doručování provozních zpráv se nyní nastavuje pomocí událostí, rout, příjemců
    a cílů. Výchozí e-mailový cíl používá primární adresu; další adresy lze přidat
    a ověřit jako vlastní cíle. Postup včetně ztlumení vybraných událostí popisuje
    návod <vpsadmin-nav id="notifications.open">vpsAdmin → Notifikace</vpsadmin-nav>.
- language: cs
  page: navody:vps:uzivatele
  path: member.edit-profile.open
  before: vpsAdmin → Upravit profil
  count: 1
- language: en
  page: manuals:vps:users
  path: notifications.open
  before: |-
    ===== E-mail addresses =====
    vpsAdmin allows users to set one primary e-mail address belonging to the
    account owner -- a member of our association. This address must be set and
    can only be a single address. In addition to the primary e-mail address, you
    can set different addresses for certain contact roles, such as an accountant
    or system administrator. These settings can be changed in user profile details
    (<vpsadmin-nav id="member.edit-profile.open">vpsAdmin -> Edit profile</vpsadmin-nav>)

    {{:en:screenshots:vpsadmin:account:email-roles.png?300|}}

    For example, the account manager receives e-mails about:

      * payment notification,
      * suspension/activation of the membership,
      * accepted payments.

    The system administrator receives e-mails about:

      * VPS status changes,
      * VPS configuration changes,
      * backup downloads,
      * VPS migrations.

    ==== Advanced settings ====
    Should contact roles not be enough or if don't wish to receive certain
    e-mails, there is an advanced settings form (<vpsadmin-nav id="member.advanced-email-configuration.open">vpsAdmin -> Edit profile ->
    Advanced e-mail configuration</vpsadmin-nav>). You can choose different e-mail addresses for
    specific mail templates or disable receiving of some mails altogether.

    {{:en:screenshots:vpsadmin:account:mail-template-recipients.png?300|}}
  body: vpsAdmin → Notifications
  replacement: |-
    ===== E-mail address and notifications =====
    The primary e-mail address belongs to the account owner, a member of the
    association. It is required, only one can be set, and it is changed in the
    account settings (vpsAdmin → Edit profile).

    Delivery of operational messages is now configured using events, routes,
    receivers and targets. The default e-mail target follows the primary address;
    additional addresses can be added and verified as custom targets. The
    <vpsadmin-nav id="notifications.open">vpsAdmin → Notifications</vpsadmin-nav>
    guide explains the complete setup, including how to mute selected events.
- language: en
  page: manuals:vps:users
  path: member.edit-profile.open
  before: vpsAdmin → Edit profile
  count: 1
