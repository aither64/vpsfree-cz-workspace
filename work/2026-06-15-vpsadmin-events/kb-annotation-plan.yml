new_pages:
- language: cs
  page: navody:notifikace
  body: |
    <page>manuals:notifications</page>
    ====== Notifikace ======

    Notifikační systém vpsAdminu převádí události na e-mailová, SMS, telegramová
    nebo webhooková doručení. Najdete jej v
    <vpsadmin-nav id="notifications.open">hlavní nabídce **Notifikace**</vpsadmin-nav>.

    Základní tok je **událost → routa → příjemce → cíl**:

      * **událost** popisuje, co se stalo,
      * **routa** vybírá události a určuje, zda směrování pokračuje,
      * **příjemce** popisuje, koho nebo kterou integraci upozornit,
      * **cíl** je konkrétní e-mail, telefonní číslo, chat v Telegramu nebo webhookový endpoint.

    Historie doručování není interní auditní protokol. Událost se do ní uloží
    pouze tehdy, když směrování připraví alespoň jedno skutečné doručení. Pokud
    potřebujete úplný externí záznam, vytvořte záchytnou routu pro všechny typy
    událostí a doručujte ji do vlastního trvalého úložiště, například webhookem.

    ===== Příklady krok za krokem =====

    Každý příklad začíná u běžného účtu s výchozími routami. Postupujte vždy podle
    jednoho samostatného návodu:

      * [[navody:notifikace:role_udalosti|Doručení událostí rolí account a admin různým kontaktům]]
      * [[navody:notifikace:ztlumeni_oom|Ztlumení vybraných OOM reportů]]
      * [[navody:notifikace:ztlumeni_incidentu|Ztlumení vybraných incidentních reportů]]
      * [[navody:notifikace:telegram|Odeslání monitoringu a incidentů do Telegramu]]
      * [[navody:notifikace:sms|Odeslání SMS při pozastavení účtu nebo VPS]]
      * [[navody:notifikace:webhook|Odeslání změn prostředků VPS na webhook]]

    ===== Routy a podmínky =====

    Routy se spravují v
    <vpsadmin-nav id="notifications.routes.open">**Notifikace → Routy**</vpsadmin-nav>.
    Routy na stejné úrovni se vyhodnocují shora dolů. Všechny podmínky jedné routy
    musí platit.

    Pro jediný přesný typ zvolte **Typ události**. **Vzor typu události** používá
    glob ve stylu shellu, například ''monitoring.*''. Obě pole ponechte prázdná
    pouze u routy, která má odpovídat všem typům. Dostupné typy a jejich pole
    ukazuje stránka **Typy událostí**.

    **Pokračovat: ano** dovolí dalším sourozeneckým routám vyhodnotit stejnou
    událost. Hodí se například při současném doručení do Telegramu a e-mailem.
    **Pokračovat: ne** zpracování na této routě zastaví; takto se běžně nastavují
    ztlumující routy. Podrouty se po shodě rodiče vyhodnotí bez ohledu na jeho
    nastavení **Pokračovat**.

    ===== Cíle a příjemci =====

    Konkrétní adresy se spravují v
    <vpsadmin-nav id="notifications.target-form.open">**Notifikace →
    Cíle**</vpsadmin-nav>. Vlastní e-mail a SMS musí být ověřeny a Telegram musí
    být spárován.

    Příjemci se spravují v
    <vpsadmin-nav id="notifications.receivers.open">**Notifikace →
    Příjemci**</vpsadmin-nav>. Příjemce může obsahovat několik cílů. Routa odkazuje
    na příjemce, nikoli přímo na adresu. Vestavěný příjemce **Ztlumit** nemá
    doručovací cíl a odpovídající události potlačí.

    {{:cs:screenshots:vpsadmin:notifications:receiver.png?900|Nastavení příjemce a jeho cílů}}

    ===== Seskupování událostí =====

    Seskupování pomáhá při velkém množství souvisejících událostí v krátkém čase.
    Místo zprávy pro každou událost je vpsAdmin shromáždí a odešle souhrn. Výchozí
    routa OOM reportů seskupuje podle ''vps_id'': reporty jedné VPS jsou ve
    společném souhrnu a různé VPS zůstávají oddělené.

    Seskupování se nastavuje samostatně na existující routě v
    <vpsadmin-nav id="notifications.route-grouping-form.open">**Notifikace → Routy
    → upravit routu → Seskupování notifikací**</vpsadmin-nav>:

      * **Seskupit podle polí** obsahuje čárkami oddělená skalární pole události. Jejich hodnoty určují skupinu. Prázdný seznam vytvoří jednu skupinu pro všechny události odpovídající routě.
      * **Počáteční čekání** určuje, kolik sekund první událost počká, aby se k ní mohly přidat další.
      * **Interval opakování** je nejkratší prodleva před dalším souhrnem ze stejné stále aktivní skupiny.

    U přesného typu používejte pole uvedená na stránce **Typy událostí**. Routa se
    vzorem nebo pro všechny typy může použít pouze společná pole, která formulář
    přijme. Nastavení patří pouze dané routě a podrouty je nedědí. Kandidáti
    zastavení ztlumením, neaktivním intervalem nebo bez odpovídajícího doručení
    se neukládají a do skupiny nevstoupí.

    Skupina vzniká pro routu a příjemce před odesláním jednotlivými způsoby. Má-li
    jeden příjemce e-mailový, telegramový i webhookový cíl, všechny dostanou stejnou
    sadu událostí. Nejde o tři samostatně časované skupiny.

    {{:cs:screenshots:vpsadmin:notifications:grouping-route.png?900|Seskupování na routě OOM reportů}}

    V
    <vpsadmin-nav id="notifications.groups.open">**Notifikace → Skupiny
    notifikací**</vpsadmin-nav> lze prohlížet otevřené, zpožděné, neaktivní i
    historické skupiny. Detail ukazuje routu, příjemce, seskupovací hodnoty,
    časování, čekající události a doručení. Jednotlivá doručení zůstávají viditelná
    v detailu události.

    ===== Časové intervaly =====

    Opakovaně použitelné intervaly se definují v
    <vpsadmin-nav id="notifications.time-intervals.open">**Notifikace → Časové
    intervaly**</vpsadmin-nav>. Hodí se například pro:

      * ztlumení upozornění mimo pracovní dobu,
      * rozdělení doručení během pracovní doby a pohotovosti různým lidem či týmům,
      * omezení routy na pravidelné servisní okno,
      * vyjádření doplňujících se rozvrhů pomocí samostatných rout.

    Každý interval má časové pásmo IANA a jednu či více specifikací. Pole jedné
    specifikace se spojují logickým **a**; více rozsahů nebo specifikací představuje
    alternativy.

    {{:cs:screenshots:vpsadmin:notifications:time-interval.png?900|Nastavení časového intervalu}}

    Interval se přiřazuje v
    <vpsadmin-nav id="notifications.route-time-intervals.open">**Notifikace → Routy
    → upravit routu**</vpsadmin-nav> jako **Aktivní interval** nebo **Ztlumující
    interval**. Bez aktivního intervalu není doba routy omezena. Shoda libovolného
    ztlumujícího intervalu danou routu potlačí.

    {{:cs:screenshots:vpsadmin:notifications:route-time-intervals.png?900|Časový interval přiřazený k routě}}

    ===== Historie doručování =====

    Uložená doručení lze zkontrolovat v
    <vpsadmin-nav id="notifications.event-route-matches.open">**Notifikace →
    Historie doručování → detail události**</vpsadmin-nav>. Detail ukazuje
    odpovídající routy, doručení a snímek vyhodnocení v okamžiku události.
    Kandidát zastavený pouze ztlumením, neaktivním intervalem nebo bez
    odpovídající routy se neukládá, proto se v historii nezobrazí.

    **Testovací notifikace** umožňuje prověřit routování bez skutečného
    pozastavení nebo incidentu. Pokud žádná povolená routa nepřipraví doručení,
    test skončí chybou a nic se do historie neuloží. Úspěšné doručení je skutečné
    a může odeslat e-mail, Telegram, SMS nebo webhook.
- language: cs
  page: navody:notifikace:role_udalosti
  body: |
    <page>manuals:notifications:event_roles</page>
    ====== Doručení událostí podle role account nebo admin ======

    Role události označuje zamýšlené publikum notifikace. Neuděluje oprávnění ve
    vpsAdminu a nesouvisí s přístupovou rolí uživatele.

    Role ''account'' se používá pro správu členství a účtu, platby a vyúčtování,
    požadavky a bezpečnostní zprávy určené majiteli účtu nebo účetnímu. Role
    ''admin'' se používá pro provoz VPS, monitoring, OOM a incidentní reporty,
    zálohy a migrace určené technickému správci. Konkrétní typy ověřte na stránce
    **Typy událostí**. Jedna událost může mít obě role; potom ji dostanou oba
    kontakty.

    Nejprve si přečtěte [[navody:notifikace|přehled notifikačního systému]].

    ===== Krok 1: Vytvořte a ověřte dva e-mailové cíle =====

    V <vpsadmin-nav id="notifications.target-form.open">**Notifikace →
    Cíle**</vpsadmin-nav> přidejte dva e-mailové cíle, například **E-mail účtu** a
    **E-mail správce**. Než budete pokračovat, otevřete odkaz v každé ověřovací
    zprávě.

    ===== Krok 2: Vytvořte dva příjemce =====

    V <vpsadmin-nav id="notifications.receivers.open">**Notifikace →
    Příjemci**</vpsadmin-nav> vytvořte **Kontakt účtu**. Otevřete jej a přidejte
    ověřený cíl **E-mail účtu**.

    Stejně vytvořte **Kontakt správce** a přidejte **E-mail správce**.

    {{:cs:screenshots:vpsadmin:notifications:example-role-receiver.png?900|E-mailový cíl připojený k příjemci Kontakt účtu}}

    ===== Krok 3: Přidejte routu role account =====

    V <vpsadmin-nav id="notifications.routes.open">**Notifikace →
    Routy**</vpsadmin-nav> zvolte **Přidat routu**:

    ^ Pole ^ Hodnota ^
    | Název | ''Události role account'' |
    | Typ události | ponechte prázdný |
    | Vzor typu události | ponechte prázdný |
    | Příjemce | Kontakt účtu |
    | Povoleno | ano |
    | Pokračovat | ano |

    Routu uložte. V jejím detailu zvolte **Přidat podmínku**:

    ^ Nastavení podmínky ^ Hodnota ^
    | Typ události | Libovolný typ události |
    | Pole | ''roles'' |
    | Operátor | obsahuje položku seznamu |
    | Hodnota | ''account'' |

    {{:cs:screenshots:vpsadmin:notifications:example-role-routing.png?900|Routa role account s podmínkou roles}}

    ===== Krok 4: Přidejte routu role admin =====

    Zopakujte Krok 3 s názvem **Události role admin**, příjemcem **Kontakt
    správce** a hodnotou podmínky ''admin''. **Pokračovat** nechte zapnuté.

    {{:cs:screenshots:vpsadmin:notifications:example-role-admin-route.png?900|Routa role admin s podmínkou roles}}

    Díky zapnutému **Pokračovat** se událost s oběma rolemi doručí oběma
    kontaktům a mohou ji zpracovat i další routy.

    ===== Krok 5: Ověřte výsledek =====

    Vytvořte **Testovací notifikaci** typu ''vps.suspended''. Tento typ má role
    ''account'' i ''admin''. Zadejte například:

    <code json>
    {
      "vps_id": 123,
      "vps_hostname": "example-vps",
      "state": "suspended",
      "reason": "Role routing test"
    }
    </code>

    Hodnoty jsou pouze obsahem testovací události; skutečná VPS se nepozastaví.
    Role se vybírají podle typu události a nelze je změnit položkou v JSON.

    Vytvořenou událost otevřete v
    <vpsadmin-nav id="notifications.event-route-matches.open">**Notifikace →
    Historie doručování → detail události**</vpsadmin-nav>. V tabulce
    odpovídajících rout musí
    být obě nové routy. Test provádí skutečná doručení, takže zprávu mají dostat
    obě ověřené adresy.

    {{:cs:screenshots:vpsadmin:notifications:example-role-result.png?900|Testovací notifikace odpovídající oběma rolovým routám}}
- language: cs
  page: navody:notifikace:ztlumeni_oom
  body: |
    <page>manuals:notifications:mute_oom</page>
    ====== Ztlumení vybraných OOM reportů ======

    Tento příklad ztlumí OOM reporty z cgroups uživatelských relací na VPS s ID
    ''123''. Ostatní OOM reporty se nezmění. Použije se vestavěný příjemce
    **Ztlumit**, takže není třeba vytvářet cíl ani příjemce.

    Nejprve si přečtěte [[navody:notifikace|přehled notifikačního systému]].

    ===== Krok 1: Najděte hodnoty skutečného OOM reportu =====

    V historii doručování otevřete odpovídající ''vps.oom_report'' a
    poznamenejte si pole ''vps_id'' a ''cgroup''. Cgroup je úplná cesta bez prefixu
    ''/sys/fs/cgroup'', například
    ''/user.slice/user-1000.slice/session-2.scope''.

    ===== Krok 2: Vytvořte ztlumující routu =====

    V <vpsadmin-nav id="notifications.routes.open">**Notifikace →
    Routy**</vpsadmin-nav> zvolte **Přidat routu**:

    ^ Pole ^ Hodnota ^
    | Název | ''Ztlumit vybrané OOM reporty'' |
    | Typ události | ''vps.oom_report'' |
    | Příjemce | Ztlumit |
    | Povoleno | ano |
    | Pokračovat | ne |

    Routu uložte.

    ===== Krok 3: Přidejte obě podmínky =====

    Do uložené routy přidejte:

    ^ Pole ^ Operátor ^ Hodnota ^
    | ''vps_id'' | rovná se | ''123'' |
    | ''cgroup'' | odpovídá glob vzoru | %%/user.slice/**/*.scope%% |

    Všechny podmínky musí platit současně. V globu může %%**%% odpovídat několika
    úrovním adresářů.

    {{:cs:screenshots:vpsadmin:notifications:example-mute-oom.png?900|Ztlumení OOM reportů podle VPS a cgroup}}

    **Pokračovat** nechte vypnuté, jinak by report mohly odeslat další routy.

    ===== Krok 4: Ověřte routu =====

    Vytvořte **Testovací notifikaci** typu ''vps.oom_report'':

    <code json>
    {
      "vps_id": 123,
      "vps_hostname": "example-vps",
      "oom_report_id": 987,
      "cgroup": "/user.slice/user-1000.slice/session-2.scope",
      "count": 1,
      "oom_count": 1,
      "killed_name": "worker"
    }
    </code>

    Pokud je ztlumující routa první shodou a žádná jiná routa nepřipraví
    doručení, test musí oznámit, že žádná povolená routa doručení nevytvořila.
    V **Historii doručování** se takový kandidát nesmí objevit.
- language: cs
  page: navody:notifikace:ztlumeni_incidentu
  body: |
    <page>manuals:notifications:mute_incidents</page>
    ====== Ztlumení vybraných incidentních reportů ======

    Tento příklad ztlumí incidenty s kódovým označením ''abuse-feed'' pro VPS s ID
    ''123''. Ostatní incidenty se nezmění. Použije se vestavěný příjemce
    **Ztlumit**.

    Nejprve si přečtěte [[navody:notifikace|přehled notifikačního systému]].

    ===== Krok 1: Určete incident =====

    V historii doručování otevřete odpovídající ''vps.incident_report''.
    Zkopírujte pole ''vps_id'' a ''codename''. ''codename'' je stabilní
    označení zdroje incidentu, nikoli zobrazený předmět nebo text reportu.

    ===== Krok 2: Vytvořte ztlumující routu =====

    V <vpsadmin-nav id="notifications.routes.open">**Notifikace →
    Routy**</vpsadmin-nav> zvolte **Přidat routu**:

    ^ Pole ^ Hodnota ^
    | Název | ''Ztlumit incidentní zdroj pro VPS'' |
    | Typ události | ''vps.incident_report'' |
    | Příjemce | Ztlumit |
    | Povoleno | ano |
    | Pokračovat | ne |

    Routu uložte.

    ===== Krok 3: Přidejte obě podmínky =====

    Přidejte:

    ^ Pole ^ Operátor ^ Hodnota ^
    | ''vps_id'' | rovná se | ''123'' |
    | ''codename'' | rovná se | ''abuse-feed'' |

    {{:cs:screenshots:vpsadmin:notifications:example-mute-incident-route.png?900|Ztlumení incidentů podle ID VPS a kódového označení}}

    **Pokračovat** nechte vypnuté, aby se odpovídající incident dále nesměroval.

    ===== Krok 4: Ověřte routu =====

    Vytvořte **Testovací notifikaci** typu ''vps.incident_report'':

    <code json>
    {
      "subject": "Documentation incident",
      "text": "Synthetic incident used to test routing.",
      "codename": "abuse-feed",
      "vps_id": 123
    }
    </code>

    Pokud je nová ztlumující routa první shodou a žádná jiná routa nepřipraví
    doručení, test musí oznámit, že žádná povolená routa doručení nevytvořila.
    V **Historii doručování** se takový kandidát nesmí objevit.
- language: cs
  page: navody:notifikace:telegram
  body: |
    <page>manuals:notifications:telegram</page>
    ====== Odeslání monitoringu a incidentů do Telegramu ======

    Tento příklad posílá všechny události ''monitoring.*'' a
    ''vps.incident_report'' do soukromého chatu v Telegramu a zároveň zachová běžné
    e-mailové doručení.

    Nejprve si přečtěte [[navody:notifikace|přehled notifikačního systému]].

    ===== Krok 1: Spárujte telegramový cíl =====

    V <vpsadmin-nav id="notifications.target-form.open">**Notifikace →
    Cíle**</vpsadmin-nav> přidejte cíl typu **Telegram** s názvem **Provozní
    Telegram**.

    Zobrazený párovací odkaz otevřete v soukromém chatu s botem, stiskněte
    **Start** a vraťte se do vpsAdminu. Cíl musí mít stav **spárováno**. Párovací
    odkaz je tajný a neposílejte jej dalším lidem.

    {{:cs:screenshots:vpsadmin:notifications:example-telegram-target.png?900|Spárovaný telegramový cíl}}

    ===== Krok 2: Vytvořte příjemce =====

    V <vpsadmin-nav id="notifications.receivers.open">**Notifikace →
    Příjemci**</vpsadmin-nav> vytvořte **Provozní Telegram**. Otevřete jej a
    připojte spárovaný cíl stejného názvu.

    {{:cs:screenshots:vpsadmin:notifications:example-telegram.png?900|Telegramový cíl připojený k příjemci}}

    ===== Krok 3: Směrujte monitoring =====

    V <vpsadmin-nav id="notifications.routes.open">**Notifikace →
    Routy**</vpsadmin-nav> přidejte:

    ^ Pole ^ Hodnota ^
    | Název | ''Monitoring do Telegramu'' |
    | Typ události | ponechte prázdný |
    | Vzor typu události | ''monitoring.*'' |
    | Příjemce | Provozní Telegram |
    | Povoleno | ano |
    | Pokračovat | ano |

    {{:cs:screenshots:vpsadmin:notifications:example-telegram-monitoring-route.png?900|Telegramová routa pro monitoring.*}}

    ===== Krok 4: Směrujte incidentní reporty =====

    Přidejte další routu:

    ^ Pole ^ Hodnota ^
    | Název | ''Incidenty do Telegramu'' |
    | Typ události | ''vps.incident_report'' |
    | Vzor typu události | ponechte prázdný |
    | Příjemce | Provozní Telegram |
    | Povoleno | ano |
    | Pokračovat | ano |

    {{:cs:screenshots:vpsadmin:notifications:example-telegram-incident-route.png?900|Telegramová routa pro incidentní reporty}}

    **Pokračovat** zůstává zapnuté, aby stejné události nadále chodily i e-mailem.

    ===== Krok 5: Ověřte doručení do Telegramu =====

    Pro bezpečný test spojení dočasně přidejte routu pro přesný typ
    ''user.test_notification'', příjemce **Provozní Telegram** a **Pokračovat:
    ne**. Vytvořte testovací notifikaci, zkontrolujte zprávu v Telegramu a dočasnou
    routu smažte.

    {{:cs:screenshots:vpsadmin:notifications:example-telegram-result.png?900|Testovací notifikace zastavená dočasnou telegramovou routou}}

    Příští skutečný monitoring nebo incident zkontrolujte v
    <vpsadmin-nav id="notifications.event-route-matches.open">**Notifikace →
    Historie doručování → detail události**</vpsadmin-nav>. Obecná syntetická
    událost nemusí
    mít reálný monitoringový nebo incidentní objekt, který potřebuje šablona;
    spojení proto testujte dočasnou routou.
- language: cs
  page: navody:notifikace:sms
  body: |
    <page>manuals:notifications:sms</page>
    ====== Odeslání SMS při pozastavení účtu nebo VPS ======

    Tento příklad pošle SMS při pozastavení celého účtu nebo jednotlivé VPS a
    zároveň zachová běžné e-mailové notifikace.

    Nejprve si přečtěte [[navody:notifikace|přehled notifikačního systému]].

    ===== Krok 1: Přidejte a ověřte SMS cíl =====

    V <vpsadmin-nav id="notifications.target-form.open">**Notifikace →
    Cíle**</vpsadmin-nav> přidejte cíl typu **SMS**. Číslo zadejte v mezinárodním
    formátu E.164, například ''+420123456789'', a uložte jej.

    Odešlete ověřovací SMS a zapište přijatý kód. Zprávy může přijímat pouze
    povolený a ověřený cíl.

    {{:cs:screenshots:vpsadmin:notifications:example-sms-verification.png?900|Ověření SMS cíle přijatým kódem}}

    ===== Krok 2: Vytvořte příjemce =====

    V <vpsadmin-nav id="notifications.receivers.open">**Notifikace →
    Příjemci**</vpsadmin-nav> vytvořte **SMS pozastavení**. Otevřete jej a připojte
    ověřený SMS cíl.

    {{:cs:screenshots:vpsadmin:notifications:example-sms.png?900|Ověřený SMS cíl připojený k příjemci}}

    ===== Krok 3: Směrujte pozastavení účtu =====

    V <vpsadmin-nav id="notifications.routes.open">**Notifikace →
    Routy**</vpsadmin-nav> přidejte:

    ^ Pole ^ Hodnota ^
    | Název | ''SMS při pozastavení účtu'' |
    | Typ události | ''user.suspended'' |
    | Příjemce | SMS pozastavení |
    | Povoleno | ano |
    | Pokračovat | ano |

    {{:cs:screenshots:vpsadmin:notifications:example-sms-account-route.png?900|SMS routa pro pozastavení účtu}}

    ===== Krok 4: Směrujte pozastavení VPS =====

    Přidejte:

    ^ Pole ^ Hodnota ^
    | Název | ''SMS při pozastavení VPS'' |
    | Typ události | ''vps.suspended'' |
    | Příjemce | SMS pozastavení |
    | Povoleno | ano |
    | Pokračovat | ano |

    {{:cs:screenshots:vpsadmin:notifications:example-sms-vps-route.png?900|SMS routa pro pozastavení VPS}}

    ''user.suspended'' se týká celého účtu a ''vps.suspended'' jedné VPS.
    **Pokračovat** nechte zapnuté, aby zůstalo zachováno e-mailové doručení.

    ===== Krok 5: Otestujte a zkontrolujte doručení =====

    Volitelně vytvořte testovací událost ''user.suspended'':

    <code json>
    {
      "state": "suspended",
      "reason": "Routing test"
    }
    </code>

    Test nic nepozastaví, ale odešle skutečnou SMS, která může být zpoplatněna.

    {{:cs:screenshots:vpsadmin:notifications:example-sms-result.png?900|Test pozastavení účtu odpovídající SMS routě}}

    Výsledek zkontrolujte v
    <vpsadmin-nav id="notifications.event-route-matches.open">**Notifikace →
    Historie doručování → detail události**</vpsadmin-nav>. Routa VPS se ověří
    při příštím
    skutečném pozastavení, protože obecný test není spojen s reálnou VPS potřebnou
    šablonou zprávy.
- language: cs
  page: navody:notifikace:webhook
  body: |
    <page>manuals:notifications:webhook</page>
    ====== Odeslání změn prostředků VPS na webhook ======

    Tento příklad posílá podepsaný JSON na HTTPS endpoint při každé události
    ''vps.resources_changed''. Formát podporuje jednotlivé i seskupené notifikace.

    Nejprve si přečtěte [[navody:notifikace|přehled notifikačního systému]].

    ===== Krok 1: Připravte jednoduchý přijímací server =====

    Následující kód uložte jako ''webhook_server.py''. Ověří podpis HMAC z přesného těla
    požadavku, porovná ID doručení a vypíše všechny přijaté události:

    <kb-code-sample id="notifications.webhook-server" />

    Spusťte jej za veřejnou HTTPS reverzní proxy:

    <code>
    export WEBHOOK_SECRET="$(openssl rand -hex 32)"
    printf '%s\n' "$WEBHOOK_SECRET"
    python3 webhook_server.py
    </code>

    Tajemství bezpečně uložte. Server naslouchá pouze na ''127.0.0.1:8080''; URL
    nastavená ve vpsAdminu musí být veřejná a používat HTTPS.

    ===== Krok 2: Vytvořte webhookový cíl =====

    V <vpsadmin-nav id="notifications.target-form.open">**Notifikace →
    Cíle**</vpsadmin-nav> přidejte typ **Webhook**. Zadejte veřejnou URL, například
    ''https://events.example.net/vpsadmin'', a stejné tajemství. vpsAdmin odmítá
    privátní, lokální, link-local a jiné nebezpečné cílové adresy.

    {{:cs:screenshots:vpsadmin:notifications:example-webhook-target.png?900|Webhookový cíl s veřejnou URL a HMAC tajemstvím}}

    ===== Krok 3: Vytvořte příjemce =====

    V <vpsadmin-nav id="notifications.receivers.open">**Notifikace →
    Příjemci**</vpsadmin-nav> vytvořte **Webhook změn prostředků** a připojte k
    němu nový webhookový cíl.

    {{:cs:screenshots:vpsadmin:notifications:example-webhook.png?900|Webhookový cíl připojený k příjemci}}

    ===== Krok 4: Vytvořte routu =====

    V <vpsadmin-nav id="notifications.routes.open">**Notifikace →
    Routy**</vpsadmin-nav> přidejte:

    ^ Pole ^ Hodnota ^
    | Název | ''Webhook změn prostředků VPS'' |
    | Typ události | ''vps.resources_changed'' |
    | Příjemce | Webhook změn prostředků |
    | Povoleno | ano |
    | Pokračovat | ano |

    {{:cs:screenshots:vpsadmin:notifications:example-webhook-route.png?900|Webhooková routa pro změny prostředků VPS}}

    ===== Krok 5: Ověřte webhook =====

    Pro tento test dočasně vypněte **Pokračovat**. Syntetická událost se tak
    nedostane k výchozím šablonám, které potřebují reálnou VPS. Vytvořte testovací
    událost ''vps.resources_changed'':

    <code json>
    {
      "vps_id": 123,
      "vps_hostname": "example-vps",
      "cpu": 4,
      "cpu_limit": 400,
      "memory": 8192,
      "swap": 2048,
      "reason": "Memory upgrade"
    }
    </code>

    Server přijme ''Content-Type: application/json'', ''User-Agent: vpsAdmin
    notification dispatcher'', ''X-VpsAdmin-Delivery'' a
    ''X-VpsAdmin-Signature-256''. U doručení jediné události je přítomna také
    hlavička ''X-VpsAdmin-Event''. Seskupený požadavek má místo ní
    ''X-VpsAdmin-Group'' a v poli ''events'' může obsahovat více událostí.

    Odpovídající routu zkontrolujte v
    <vpsadmin-nav id="notifications.event-route-matches.open">**Notifikace →
    Historie doručování → detail události**</vpsadmin-nav> a poté znovu zapněte
    **Pokračovat**.

    {{:cs:screenshots:vpsadmin:notifications:example-webhook-result.png?900|Test změny prostředků zastavený webhookovou routou}}

    ===== Co server přijme =====

    ID a čas v tomto zkráceném příkladu jsou pouze ilustrační:

    <kb-code-sample id="notifications.webhook-single-payload" />

    Podpis je HMAC-SHA256 z nezměněných bajtů těla a má tvar
    ''sha256=<HMAC>''. Libovolná odpověď ''2xx'' znamená úspěch. Neúspěšné
    doručení se může opakovat, proto je zpracovávejte idempotentně podle podepsané
    hodnoty ''delivery.id'' v těle. Hlavička ''X-VpsAdmin-Delivery'' není sama
    podepsaná; příklad ji přijme pouze při shodě s ''delivery.id''.
- language: en
  page: manuals:notifications
  body: |
    ====== Notifications ======

    The vpsAdmin notification system turns events into e-mail, SMS, Telegram, or
    webhook deliveries. Open it from the
    <vpsadmin-nav id="notifications.open">main **Notifications** menu</vpsadmin-nav>.

    The basic flow is **event → route → receiver → target**:

      * an **event** describes what happened,
      * a **route** selects events and decides whether routing continues,
      * a **receiver** describes who or which integration should be notified,
      * a **target** is a concrete e-mail address, telephone number, Telegram chat, or webhook endpoint.

    Delivery history is not an internal audit log. An event is stored there only
    when routing prepares at least one real delivery. If you need a complete
    external record, create a catch-all route and deliver it to your own durable
    storage, for example through a webhook.

    ===== Step-by-step examples =====

    Each example starts from an ordinary account with the default routes. Follow
    one example at a time:

      * [[manuals:notifications:event_roles|Route account and admin events to different contacts]]
      * [[manuals:notifications:mute_oom|Mute selected OOM reports]]
      * [[manuals:notifications:mute_incidents|Mute selected incident reports]]
      * [[manuals:notifications:telegram|Send monitoring events and incident reports to Telegram]]
      * [[manuals:notifications:sms|Send SMS on account or VPS suspension]]
      * [[manuals:notifications:webhook|Send VPS resource changes to a webhook]]

    ===== Routes and matchers =====

    Manage routes at <vpsadmin-nav id="notifications.routes.open">**Notifications
    → Routes**</vpsadmin-nav>. Routes at the same level are evaluated from top to
    bottom. Every matcher on one route must match.

    Choose **Event type** for one exact type. Use **Event type pattern** for a
    shell-style glob such as ''monitoring.*''. Leave both empty only when the route
    is intended to match all event types. The **Event types** page lists available
    types and their fields.

    **Continue: yes** lets later sibling routes evaluate the same event. This is
    useful when, for example, both Telegram and e-mail should receive it.
    **Continue: no** stops at that route; mute routes normally use this setting.
    Subroutes are evaluated after their parent matches, independently of the
    parent's **Continue** setting.

    ===== Targets and receivers =====

    Manage concrete destinations at
    <vpsadmin-nav id="notifications.target-form.open">**Notifications →
    Targets**</vpsadmin-nav>. Custom e-mail and SMS targets must be verified and
    Telegram targets must be paired before they can receive notifications.

    Manage receivers under
    <vpsadmin-nav id="notifications.receivers.open">**Notifications →
    Receivers**</vpsadmin-nav>. A receiver can contain several targets. A route
    points to the receiver, not directly to an address. The built-in **Mute**
    receiver has no delivery target and suppresses matching events.

    {{:en:screenshots:vpsadmin:notifications:receiver.png?900|Receiver and target configuration}}

    ===== Event grouping =====

    Grouping is useful when many related events arrive in a short burst. Instead
    of sending a message for every event, vpsAdmin collects them and sends a
    summary. The default OOM-report route uses grouping by ''vps_id'', so reports
    from one VPS are summarized together and reports from different VPSes stay
    separate.

    Grouping is configured separately on an existing route at
    <vpsadmin-nav id="notifications.route-grouping-form.open">**Notifications →
    Routes → edit route → Notification grouping**</vpsadmin-nav>:

      * **Group by fields** contains comma-separated scalar event fields. Their values identify a group. Leave it empty to put all events matching the route into one group.
      * **Initial wait** is how many seconds the first event waits so more events can join a new, idle group.
      * **Repeat interval** is the minimum delay before another summary from the same still-active group.

    For an exact event type, use fields listed for that type on the **Event types**
    page. Pattern and catch-all routes can use only common fields accepted by the
    form. Grouping belongs only to that route and is not inherited by subroutes.
    Candidates stopped by a mute, an inactive interval, or the absence of a
    matching delivery are not stored and do not enter a group.

    The group is defined for the route and receiver before individual delivery
    actions are sent. If one receiver has e-mail, Telegram, and webhook targets,
    each action receives the same set of grouped events. It is not three
    independently timed groups.

    {{:en:screenshots:vpsadmin:notifications:grouping-route.png?900|Grouping settings on an OOM-report route}}

    Open
    <vpsadmin-nav id="notifications.groups.open">**Notifications → Notification
    groups**</vpsadmin-nav> to inspect open, overdue, idle, and historical groups.
    A group detail shows its route, receiver, grouping labels, timing, pending
    events, and deliveries. Individual deliveries remain visible in the event
    detail.

    ===== Time intervals =====

    Define reusable intervals under
    <vpsadmin-nav id="notifications.time-intervals.open">**Notifications → Time
    intervals**</vpsadmin-nav>. A time interval is useful for:

      * silencing alerts outside working hours,
      * sending work-hours and on-call notifications to different people or teams,
      * limiting a route to a recurring maintenance window,
      * expressing complementary schedules with separate routes.

    Each interval has an IANA time zone and one or more specifications. Fields
    within one specification use logical **AND**; multiple ranges or specifications
    are alternatives.

    {{:en:screenshots:vpsadmin:notifications:time-interval.png?900|Time interval configuration}}

    Assign an interval at
    <vpsadmin-nav id="notifications.route-time-intervals.open">**Notifications →
    Routes → edit route**</vpsadmin-nav> as an **Active interval** or **Mute
    interval**. With no active interval, the route has no active-time restriction.
    A matching mute interval suppresses that route.

    {{:en:screenshots:vpsadmin:notifications:route-time-intervals.png?900|Time interval assigned to a route}}

    ===== Delivery history =====

    Inspect stored deliveries at
    <vpsadmin-nav id="notifications.event-route-matches.open">**Notifications →
    Delivery history → event detail**</vpsadmin-nav>. The detail shows matched
    routes, deliveries, and the routing snapshot captured when the event
    occurred. A candidate stopped only by a mute, an inactive interval, or the
    absence of a matching route is not stored and does not appear here.

    **Test notification** checks routing without causing a real suspension or
    incident. If no enabled route prepares a delivery, the test fails and
    nothing is stored in delivery history. A successful notification delivery
    is real and may send e-mail, Telegram, SMS, or a webhook request.
- language: en
  page: manuals:notifications:event_roles
  body: |
    ====== Route events by account or admin role ======

    An event role identifies the intended audience for a notification. It does
    not grant vpsAdmin permissions and is unrelated to a user's access role.

    The ''account'' role covers membership and account lifecycle, payments and
    billing, requests, and security notices intended for the account owner or an
    accountant. The ''admin'' role covers VPS operation, monitoring, OOM and
    incident reports, backups, and migrations intended for a technical
    administrator. Check **Event types** for the roles of each concrete type. An
    event can have both roles, in which case both contacts receive it.

    Before starting, see the [[manuals:notifications|notification system overview]].

    ===== Step 1: Create and verify two e-mail targets =====

    At <vpsadmin-nav id="notifications.target-form.open">**Notifications →
    Targets**</vpsadmin-nav>, add two e-mail targets. Give them descriptive labels,
    for example **Account e-mail** and **Administrator e-mail**. Open the link in
    each verification message before continuing.

    ===== Step 2: Create two receivers =====

    At <vpsadmin-nav id="notifications.receivers.open">**Notifications →
    Receivers**</vpsadmin-nav>, create **Account contact**. Open it and add the
    verified **Account e-mail** target.

    Create **Administrator contact** in the same way and add **Administrator
    e-mail**.

    {{:en:screenshots:vpsadmin:notifications:example-role-receiver.png?900|E-mail target attached to the Account contact receiver}}

    ===== Step 3: Add the account-role route =====

    At <vpsadmin-nav id="notifications.routes.open">**Notifications →
    Routes**</vpsadmin-nav>, select **Add route** and set:

    ^ Field ^ Value ^
    | Label | ''Account-role notifications'' |
    | Event type | leave empty |
    | Event type pattern | leave empty |
    | Receiver | Account contact |
    | Enabled | yes |
    | Continue | yes |

    Save the route. On its detail, select **Add matcher** and set:

    ^ Matcher setting ^ Value ^
    | Event type | Any event type |
    | Field | ''roles'' |
    | Operator | contains list item |
    | Value | ''account'' |

    {{:en:screenshots:vpsadmin:notifications:example-role-routing.png?900|Account-role route with its roles matcher}}

    ===== Step 4: Add the admin-role route =====

    Repeat Step 3 with label **Admin-role notifications**, receiver
    **Administrator contact**, and matcher value ''admin''. Keep **Continue**
    enabled.

    {{:en:screenshots:vpsadmin:notifications:example-role-admin-route.png?900|Admin-role route with its roles matcher}}

    Because both routes have **Continue** enabled, an event with both roles
    reaches both contacts and can still reach later routes.

    ===== Step 5: Test the result =====

    Create a **Test notification** of type ''vps.suspended''. This type has both
    the
    ''account'' and ''admin'' roles. For example, use:

    <code json>
    {
      "vps_id": 123,
      "vps_hostname": "example-vps",
      "state": "suspended",
      "reason": "Role routing test"
    }
    </code>

    These values are only test-event content; no real VPS is suspended. Roles
    come from the selected event type and cannot be changed by adding a
    ''roles'' item to the JSON.

    Open the created event at
    <vpsadmin-nav id="notifications.event-route-matches.open">**Notifications →
    Delivery history → event detail**</vpsadmin-nav>. Both new routes must appear
    in its
    matched-routes table. Test notifications perform real deliveries, so both
    verified
    addresses should receive the message.

    {{:en:screenshots:vpsadmin:notifications:example-role-result.png?900|Test notification matching both role routes}}
- language: en
  page: manuals:notifications:mute_oom
  body: |
    ====== Mute selected OOM reports ======

    This example mutes OOM reports from user-session cgroups on VPS ID ''123'',
    while leaving other OOM reports unchanged. It uses the built-in **Mute**
    receiver, so no target or receiver has to be created.

    Before starting, see the [[manuals:notifications|notification system overview]].

    ===== Step 1: Find values from a real OOM report =====

    Open a relevant ''vps.oom_report'' in delivery history and note its
    ''vps_id'' and ''cgroup'' fields. The cgroup is a complete path without the
    ''/sys/fs/cgroup'' prefix, for example
    ''/user.slice/user-1000.slice/session-2.scope''.

    ===== Step 2: Create the mute route =====

    At <vpsadmin-nav id="notifications.routes.open">**Notifications →
    Routes**</vpsadmin-nav>, select **Add route** and set:

    ^ Field ^ Value ^
    | Label | ''Mute selected OOM reports'' |
    | Event type | ''vps.oom_report'' |
    | Receiver | Mute |
    | Enabled | yes |
    | Continue | no |

    Save the route.

    ===== Step 3: Add both matchers =====

    Add these matchers to the saved route:

    ^ Field ^ Operator ^ Value ^
    | ''vps_id'' | equals | ''123'' |
    | ''cgroup'' | matches glob | %%/user.slice/**/*.scope%% |

    All matchers on a route must match. In this glob, %%**%% can span several
    directory levels.

    {{:en:screenshots:vpsadmin:notifications:example-mute-oom.png?900|OOM-report mute route with VPS and cgroup matchers}}

    Keep **Continue** disabled, otherwise another route could still send the
    report.

    ===== Step 4: Test the route =====

    Create a **Test notification** of type ''vps.oom_report'' with
    representative fields:

    <code json>
    {
      "vps_id": 123,
      "vps_hostname": "example-vps",
      "oom_report_id": 987,
      "cgroup": "/user.slice/user-1000.slice/session-2.scope",
      "count": 1,
      "oom_count": 1,
      "killed_name": "worker"
    }
    </code>

    If the mute route is the first match and no other route prepares a delivery,
    the test must report that no enabled route produced a delivery. The
    candidate must not appear in **Delivery history**.
- language: en
  page: manuals:notifications:mute_incidents
  body: |
    ====== Mute selected incident reports ======

    This example mutes incident reports with codename ''abuse-feed'' for VPS ID
    ''123'', while leaving other incident reports unchanged. It uses the built-in
    **Mute** receiver.

    Before starting, see the [[manuals:notifications|notification system overview]].

    ===== Step 1: Identify the incident =====

    Open a relevant ''vps.incident_report'' in delivery history. Copy its
    ''vps_id'' and ''codename'' fields. The codename is the stable identifier of
    the incident source; it is not the displayed subject or report text.

    ===== Step 2: Create the mute route =====

    At <vpsadmin-nav id="notifications.routes.open">**Notifications →
    Routes**</vpsadmin-nav>, select **Add route** and set:

    ^ Field ^ Value ^
    | Label | ''Mute incident feed for VPS'' |
    | Event type | ''vps.incident_report'' |
    | Receiver | Mute |
    | Enabled | yes |
    | Continue | no |

    Save the route.

    ===== Step 3: Add both matchers =====

    Add:

    ^ Field ^ Operator ^ Value ^
    | ''vps_id'' | equals | ''123'' |
    | ''codename'' | equals | ''abuse-feed'' |

    {{:en:screenshots:vpsadmin:notifications:example-mute-incident-route.png?900|Incident mute route with VPS ID and codename matchers}}

    Keep **Continue** disabled so the matching incident is not routed further.

    ===== Step 4: Test the route =====

    Create a **Test notification** of type ''vps.incident_report'':

    <code json>
    {
      "subject": "Documentation incident",
      "text": "Synthetic incident used to test routing.",
      "codename": "abuse-feed",
      "vps_id": 123
    }
    </code>

    If the new mute route is the first match and no other route prepares a
    delivery, the test must report that no enabled route produced a delivery.
    The candidate must not appear in **Delivery history**.
- language: en
  page: manuals:notifications:telegram
  body: |
    ====== Send monitoring and incident events to Telegram ======

    This example sends all ''monitoring.*'' events and all
    ''vps.incident_report'' events to a private Telegram chat while preserving
    normal e-mail delivery.

    Before starting, see the [[manuals:notifications|notification system overview]].

    ===== Step 1: Pair a Telegram target =====

    At <vpsadmin-nav id="notifications.target-form.open">**Notifications →
    Targets**</vpsadmin-nav>, add a **Telegram** target named **Operations
    Telegram**.

    Open the displayed pairing link in a private chat with the bot, press **Start**,
    and return to vpsAdmin. The target must show **paired**. Treat the pairing link
    as a secret and do not share it.

    {{:en:screenshots:vpsadmin:notifications:example-telegram-target.png?900|Paired Telegram target}}

    ===== Step 2: Create a receiver =====

    At <vpsadmin-nav id="notifications.receivers.open">**Notifications →
    Receivers**</vpsadmin-nav>, create **Operations Telegram**. Open it and attach
    the paired target with the same name.

    {{:en:screenshots:vpsadmin:notifications:example-telegram.png?900|Telegram target attached to its receiver}}

    ===== Step 3: Route monitoring events =====

    At <vpsadmin-nav id="notifications.routes.open">**Notifications →
    Routes**</vpsadmin-nav>, add:

    ^ Field ^ Value ^
    | Label | ''Monitoring to Telegram'' |
    | Event type | leave empty |
    | Event type pattern | ''monitoring.*'' |
    | Receiver | Operations Telegram |
    | Enabled | yes |
    | Continue | yes |

    {{:en:screenshots:vpsadmin:notifications:example-telegram-monitoring-route.png?900|Telegram route for monitoring.*}}

    ===== Step 4: Route incident reports =====

    Add another route:

    ^ Field ^ Value ^
    | Label | ''Incident reports to Telegram'' |
    | Event type | ''vps.incident_report'' |
    | Event type pattern | leave empty |
    | Receiver | Operations Telegram |
    | Enabled | yes |
    | Continue | yes |

    {{:en:screenshots:vpsadmin:notifications:example-telegram-incident-route.png?900|Telegram route for incident reports}}

    **Continue** remains enabled so the same events can still be delivered by
    e-mail.

    ===== Step 5: Test Telegram delivery =====

    For a safe connection test, temporarily add a route for exact event type
    ''user.test_notification'', receiver **Operations Telegram**, and **Continue:
    no**. Create a test notification, check the Telegram message, and delete the
    temporary route.

    {{:en:screenshots:vpsadmin:notifications:example-telegram-result.png?900|Test notification stopped by the temporary Telegram route}}

    Inspect the next real monitoring or incident event at
    <vpsadmin-nav id="notifications.event-route-matches.open">**Notifications →
    Delivery history → event detail**</vpsadmin-nav>. A generic synthetic event
    may lack
    the real monitoring or incident object required by its message template, so
    use the temporary test route to test the connection itself.
- language: en
  page: manuals:notifications:sms
  body: |
    ====== Send SMS on account or VPS suspension ======

    This example sends SMS when the whole account or an individual VPS is
    suspended, while preserving normal e-mail notifications.

    Before starting, see the [[manuals:notifications|notification system overview]].

    ===== Step 1: Add and verify an SMS target =====

    At <vpsadmin-nav id="notifications.target-form.open">**Notifications →
    Targets**</vpsadmin-nav>, add an **SMS** target. Enter the telephone number in
    international E.164 format, for example ''+420123456789'', and save it.

    Send the verification SMS and enter the received code. Only an enabled,
    verified target can receive notifications.

    {{:en:screenshots:vpsadmin:notifications:example-sms-verification.png?900|Verifying an SMS target with its code}}

    ===== Step 2: Create a receiver =====

    At <vpsadmin-nav id="notifications.receivers.open">**Notifications →
    Receivers**</vpsadmin-nav>, create **Suspension SMS**. Open it and attach the
    verified SMS target.

    {{:en:screenshots:vpsadmin:notifications:example-sms.png?900|Verified SMS target attached to its receiver}}

    ===== Step 3: Route account suspensions =====

    At <vpsadmin-nav id="notifications.routes.open">**Notifications →
    Routes**</vpsadmin-nav>, add:

    ^ Field ^ Value ^
    | Label | ''Account suspension SMS'' |
    | Event type | ''user.suspended'' |
    | Receiver | Suspension SMS |
    | Enabled | yes |
    | Continue | yes |

    {{:en:screenshots:vpsadmin:notifications:example-sms-account-route.png?900|SMS route for account suspension}}

    ===== Step 4: Route VPS suspensions =====

    Add:

    ^ Field ^ Value ^
    | Label | ''VPS suspension SMS'' |
    | Event type | ''vps.suspended'' |
    | Receiver | Suspension SMS |
    | Enabled | yes |
    | Continue | yes |

    {{:en:screenshots:vpsadmin:notifications:example-sms-vps-route.png?900|SMS route for VPS suspension}}

    ''user.suspended'' concerns the whole account, while ''vps.suspended'' concerns
    one VPS. Keep **Continue** enabled so e-mail delivery remains active.

    ===== Step 5: Test and inspect delivery =====

    Optionally create a ''user.suspended'' test notification with:

    <code json>
    {
      "state": "suspended",
      "reason": "Routing test"
    }
    </code>

    The test suspends nothing, but sends a real SMS and may incur the normal SMS
    charge.

    {{:en:screenshots:vpsadmin:notifications:example-sms-result.png?900|Account suspension test matching the SMS route}}

    Inspect the result at
    <vpsadmin-nav id="notifications.event-route-matches.open">**Notifications →
    Delivery history → event detail**</vpsadmin-nav>. Verify the VPS route on the
    next real
    VPS suspension because a generic test is not attached to the real VPS required
    by its message template.
- language: en
  page: manuals:notifications:webhook
  body: |
    ====== Send VPS resource changes to a webhook ======

    This example sends signed JSON to an HTTPS endpoint for every
    ''vps.resources_changed'' event. The payload supports both individual and
    grouped notifications.

    Before starting, see the [[manuals:notifications|notification system overview]].

    ===== Step 1: Prepare a simple receiver server =====

    Save this as ''webhook_server.py''. It verifies the HMAC signature over the exact
    request body, checks the delivery ID, and prints every received event:

    <kb-code-sample id="notifications.webhook-server" />

    Run it behind a public HTTPS reverse proxy:

    <code>
    export WEBHOOK_SECRET="$(openssl rand -hex 32)"
    printf '%s\n' "$WEBHOOK_SECRET"
    python3 webhook_server.py
    </code>

    Store the secret securely. The example server listens only on
    ''127.0.0.1:8080''; the URL configured in vpsAdmin must be public HTTPS.

    ===== Step 2: Create the webhook target =====

    At <vpsadmin-nav id="notifications.target-form.open">**Notifications →
    Targets**</vpsadmin-nav>, add a **Webhook** target. Enter a public URL such as
    ''https://events.example.net/vpsadmin'' and the same secret. vpsAdmin rejects
    private, local, link-local, and otherwise unsafe destination addresses.

    {{:en:screenshots:vpsadmin:notifications:example-webhook-target.png?900|Webhook target with a public URL and HMAC secret}}

    ===== Step 3: Create the receiver =====

    At <vpsadmin-nav id="notifications.receivers.open">**Notifications →
    Receivers**</vpsadmin-nav>, create **Resource-change webhook** and attach the
    new webhook target.

    {{:en:screenshots:vpsadmin:notifications:example-webhook.png?900|Webhook target attached to its receiver}}

    ===== Step 4: Create the route =====

    At <vpsadmin-nav id="notifications.routes.open">**Notifications →
    Routes**</vpsadmin-nav>, add:

    ^ Field ^ Value ^
    | Label | ''VPS resource-change webhook'' |
    | Event type | ''vps.resources_changed'' |
    | Receiver | Resource-change webhook |
    | Enabled | yes |
    | Continue | yes |

    {{:en:screenshots:vpsadmin:notifications:example-webhook-route.png?900|Webhook route for VPS resource changes}}

    ===== Step 5: Test the webhook =====

    Temporarily disable **Continue** for this test. This keeps the synthetic event
    away from default templates that require a real VPS. Create a
    ''vps.resources_changed'' test event:

    <code json>
    {
      "vps_id": 123,
      "vps_hostname": "example-vps",
      "cpu": 4,
      "cpu_limit": 400,
      "memory": 8192,
      "swap": 2048,
      "reason": "Memory upgrade"
    }
    </code>

    The server receives ''Content-Type: application/json'', ''User-Agent: vpsAdmin
    notification dispatcher'', ''X-VpsAdmin-Delivery'', and
    ''X-VpsAdmin-Signature-256''. ''X-VpsAdmin-Event'' is present for a
    single-event delivery. A grouped request instead has ''X-VpsAdmin-Group'' and
    can contain several entries in ''events''.

    Inspect the matched route at
    <vpsadmin-nav id="notifications.event-route-matches.open">**Notifications →
    Delivery history → event detail**</vpsadmin-nav>, then re-enable
    **Continue**.

    {{:en:screenshots:vpsadmin:notifications:example-webhook-result.png?900|Resource-change test stopped by the webhook route}}

    ===== What the server receives =====

    IDs and timestamps in this shortened example are illustrative:

    <kb-code-sample id="notifications.webhook-single-payload" />

    The signature is HMAC-SHA256 over the unmodified body bytes and has the form
    ''sha256=<HMAC>''. Any ''2xx'' response is successful. Failed deliveries may
    be retried, so process them idempotently using the signed ''delivery.id'' in
    the body. The ''X-VpsAdmin-Delivery'' header is not itself signed; the example
    accepts it only when it matches ''delivery.id''.
