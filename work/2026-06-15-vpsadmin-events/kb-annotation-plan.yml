new_pages:
  - language: cs
    page: navody:notifikace
    body: |
      <page>manuals:notifications</page>
      ====== Notifikace ======

      Notifikační systém vpsAdminu zpracovává události a podle rout je předává příjemcům. Nastavení najdete v hlavní nabídce Notifikace.

      Základní tok je **událost → routa → příjemce → cíl**:

        * **událost** popisuje, co se stalo, a obsahuje typ, závažnost a doplňující údaje,
        * **routa** vybírá události podle typu a volitelných podmínek,
        * **příjemce** určuje, co se má s vybranou událostí udělat,
        * **cíl** je konkrétní e-mailová adresa, webhook, telefonní číslo nebo účet Telegramu.

      ===== Routy =====

      Routy se spravují v Notifikace → Routy. Vyhodnocují se podle pořadí. Routa může pokračovat na další odpovídající routu, obsahovat podřízené routy nebo po prvním použití zaniknout. Výchozí routy zajišťují běžné doručování na primární e-mailovou adresu; lze je doplnit vlastními routami nebo použít příjemce **Ztlumit**.

      {{:cs:screenshots:vpsadmin:notifications:routes.png?900|Přehled notifikačních rout}}

      Podmínky routy mohou porovnávat pole události. Všechny podmínky jedné routy musí platit současně. Pokud routa obsahuje konkrétní typ události, nabídka polí a operátorů se přizpůsobí jeho datům.

      ===== Příjemci a kontakty =====

      Příjemce v Notifikace → Příjemci sdružuje jeden nebo více cílů. Jeden příjemce tak může například současně odeslat e-mail a zavolat webhook. Cíl **Výchozí** používá aktuální primární e-mailovou adresu účtu. Vlastní e-mailové adresy se přidávají jako cíle a musí být před použitím ověřeny.

      {{:cs:screenshots:vpsadmin:notifications:receiver.png?900|Nastavení příjemce}}

      Příjemce lze vypnout bez odstranění jeho rout. Příjemce **Ztlumit** nevytvoří žádné odchozí doručení. Událost, která projde běžným zpracováním, zůstane v přehledu událostí; níže popsané ztlumení OOM reportu ve fázi ''raw'' je zvláštní případ.

      ===== Praktické příklady =====

      Následující příklady používají vlastní příjemce a routy. Pokud má událost kromě vlastní routy projít i dalšími odpovídajícími routami, zapněte u ní **Pokračovat**. Ztlumující routy naopak umístěte před doručovací routy a **Pokračovat** u nich vypněte.

      ==== Doručení podle role události ====

      Pole ''roles'' je seznam kontaktních rolí, pro které je událost určena. Hodnota ''account'' označuje kontakt pro vedení účtu a ''admin'' správce systému. Jedna událost může obsahovat obě role, proto použijte operátor **obsahuje položku seznamu** a ne porovnání celého seznamu.

      Nejprve vytvořte a ověřte dva e-mailové cíle a přidejte je do příjemců **Kontakt účtu** a **Kontakt správce**. Potom vytvořte tyto routy:

      ^ Typ události ^ Pole ^ Operátor ^ Hodnota ^ Příjemce ^ Pokračovat ^
      | //libovolný// | ''roles'' | obsahuje položku seznamu | ''account'' | Kontakt účtu | ano |
      | //libovolný// | ''roles'' | obsahuje položku seznamu | ''admin'' | Kontakt správce | ano |

      {{:cs:screenshots:vpsadmin:notifications:example-role-routing.png?900|Routování podle role události}}

      Volba **Pokračovat** umožní, aby událost s oběma rolemi dorazila na oba kontakty a aby zůstaly funkční i další doručovací routy.

      ==== Ztlumení vybraných OOM reportů a incidentů ====

      Pro potlačení reportů použijte příjemce **Ztlumit** a dvě samostatné routy. V příkladu se ztlumí OOM reporty VPS ''123'' z uživatelských scope a incidenty stejné VPS s kódovým označením ''abuse-feed'':

      ^ Typ události ^ Podmínky (všechny musí platit) ^ Příjemce ^ Pokračovat ^
      | ''vps.oom_report'' | ''vps_id == 123''; ''stage == raw''; ''cgroup =* /user.slice/*.scope'' | Ztlumit | ne |
      | ''vps.incident_report'' | ''vps_id == 123''; ''codename == abuse-feed'' | Ztlumit | ne |

      Operátor ''=*'' znamená **odpovídá glob vzoru**. Cesta cgroup je úplná cesta bez prefixu ''/sys/fs/cgroup''. Kódové označení incidentu určuje jeho zdroj; správnou hodnotu zkopírujte z detailu skutečného incidentu v přehledu událostí.

      {{:cs:screenshots:vpsadmin:notifications:example-mute-oom.png?900|Ztlumení OOM reportů podle cgroup}}

      Podmínka ''stage == raw'' je u OOM reportů zásadní. Routa se vyhodnotí hned při přijetí jednotlivého reportu a označí jej jako ignorovaný, takže se nezařadí do pozdějšího souhrnného oznámení. Tato přechodná ''raw'' událost se do přehledu událostí neukládá. Bez podmínky ''stage'' by routa mohla ztlumit až výsledné oznámení, ale nezabránila by seskupení reportu.

      Ztlumující routy umístěte před obecné doručovací routy a ponechte **Pokračovat** vypnuté. Konfiguraci lze ověřit pomocí **Testovací události** a počítadla shod routy; pro ověření cesty cgroup použijte hodnoty ze skutečného OOM reportu.

      ==== Monitoring a incidenty do Telegramu ====

      Vytvořte cíl typu **Telegram**, otevřete párovací odkaz v soukromém chatu s botem a stisknutím Start dokončete párování. Spárovaný cíl přidejte do příjemce **Provozní Telegram**.

      Vytvořte dvě routy:

      ^ Výběr události ^ Příjemce ^ Pokračovat ^
      | vzor ''monitoring.*'' | Provozní Telegram | ano |
      | typ ''vps.incident_report'' | Provozní Telegram | ano |

      {{:cs:screenshots:vpsadmin:notifications:example-telegram.png?900|Telegram pro monitoring a incidenty}}

      Vzor zachytí všechny typy událostí začínající ''monitoring.''. Druhá routa přidá incidentní reporty. Zapnuté **Pokračovat** ponechá v činnosti také výchozí e-mailové routy. Při novém párování se doručování do Telegramu pozastaví, dokud bot nové párování nepotvrdí.

      ==== SMS při pozastavení účtu nebo VPS ====

      Vytvořte cíl typu **SMS**, zadejte číslo v mezinárodním formátu E.164 (například ''+420123456789''), odešlete ověřovací SMS a vložte přijatý kód. Ověřený cíl přidejte do příjemce **SMS pozastavení**.

      ^ Typ události ^ Příjemce ^ Pokračovat ^
      | ''user.suspended'' | SMS pozastavení | ano |
      | ''vps.suspended'' | SMS pozastavení | ano |

      {{:cs:screenshots:vpsadmin:notifications:example-sms.png?900|SMS při pozastavení účtu nebo VPS}}

      První routa upozorní na pozastavení celého účtu, druhá na pozastavení jednotlivé VPS. Zapnuté **Pokračovat** zachová i běžná e-mailová oznámení.

      ==== Webhook při změně prostředků VPS ====

      Vytvořte cíl typu **Webhook** s veřejnou HTTPS adresou a náhodným tajemstvím HMAC. Přidejte jej do příjemce **Webhook změn prostředků** a vytvořte routu pro typ ''vps.resources_changed'' se zapnutým **Pokračovat**.

      {{:cs:screenshots:vpsadmin:notifications:example-webhook.png?900|Webhook pro změny prostředků VPS}}

      vpsAdmin odešle požadavek ''POST'' s JSON tělem a hlavičkami:

        * ''Content-Type: application/json'',
        * ''User-Agent: vpsAdmin notification dispatcher'',
        * ''X-VpsAdmin-Event: vps.resources_changed'',
        * ''X-VpsAdmin-Delivery: <ID doručení>'',
        * ''X-VpsAdmin-Signature-256: sha256=<HMAC>'' — pokud je u cíle nastaveno tajemství.

      HMAC-SHA256 se počítá z nezměněných bajtů těla požadavku. Následující jednoduchý server zkontroluje podpis, vypíše přijatý JSON a odpoví úspěšným stavem ''204''. Poslouchá pouze na localhostu; pro skutečné použití jej zpřístupněte přes veřejný HTTPS reverzní proxy server.

      <code python>
      import hashlib
      import hmac
      import json
      import os
      from http.server import BaseHTTPRequestHandler, HTTPServer

      SECRET = os.environ["VPSADMIN_WEBHOOK_SECRET"].encode()


      class Handler(BaseHTTPRequestHandler):
          def do_POST(self):
              length = int(self.headers.get("Content-Length", "0"))
              body = self.rfile.read(length)
              expected = "sha256=" + hmac.new(
                  SECRET, body, hashlib.sha256
              ).hexdigest()
              received = self.headers.get("X-VpsAdmin-Signature-256", "")

              if not hmac.compare_digest(received, expected):
                  self.send_response(401)
                  self.end_headers()
                  return

              print(json.dumps(json.loads(body), indent=2))
              self.send_response(204)
              self.end_headers()


      HTTPServer(("127.0.0.1", 8080), Handler).serve_forever()
      </code>

      Spusťte jej se stejným tajemstvím, jaké je u cíle:

      <code>
      VPSADMIN_WEBHOOK_SECRET='nahodne-dlouhe-tajemstvi' python3 webhook.py
      </code>

      Tělo požadavku vypadá například takto (ID a hodnoty jsou pouze ilustrační):

      <code json>
      {
        "event": {
          "id": 48123,
          "type": "vps.resources_changed",
          "category": "vps",
          "severity": "info",
          "subject": "VPS #123 resources changed",
          "summary": "Memory upgrade",
          "payload": {
            "vps_id": 123,
            "vps_hostname": "web.example",
            "cpu": 4,
            "cpu_limit": 400,
            "memory": 8192,
            "swap": 2048,
            "reason": "Memory upgrade",
            "admin_id": 1,
            "admin_name": "Example Admin"
          },
          "fields": {
            "event_type": "vps.resources_changed",
            "default_routed": true,
            "category": "vps",
            "severity": "info",
            "subject": "VPS #123 resources changed",
            "summary": "Memory upgrade",
            "roles": ["admin"],
            "subject_relation": "self",
            "subject_user_id": 42,
            "subject_is_self": true,
            "subject_is_admin_visible": false,
            "vps_id": 123,
            "vps_hostname": "web.example",
            "cpu": 4,
            "cpu_limit": 400,
            "memory": 8192,
            "swap": 2048,
            "reason": "Memory upgrade",
            "admin_id": 1,
            "admin_name": "Example Admin"
          },
          "ip_addr": null,
          "source": {"class": null, "id": null},
          "user": {"id": 42, "login": "example"},
          "vps": {"id": 123, "hostname": "web.example"},
          "created_at": "2026-07-23T14:15:16+02:00"
        },
        "delivery": {
          "id": 73001,
          "action": "webhook",
          "route": {
            "id": 91,
            "label": "Resource-change webhook",
            "matcher_summary": "vps.resources_changed"
          },
          "receiver": {
            "id": 37,
            "label": "Resource-change webhook"
          },
          "notification_target": {
            "id": 58,
            "label": "Resource-change webhook",
            "display_target": "https://events.example.test/vpsadmin"
          },
          "receiver_target": {"id": 64}
        }
      }
      </code>

      Cíl musí být z vpsAdminu dosažitelný. Privátní, lokální a link-local adresy jsou běžně odmítnuty, proto nepoužívejte například ''127.0.0.1'' nebo adresu z domácí sítě jako URL cíle. Za úspěch se považuje libovolná odpověď ''2xx''. Neúspěšné doručení se může opakovat; zpracování proto navrhněte idempotentně podle ''delivery.id'' nebo hlavičky ''X-VpsAdmin-Delivery''.

      ===== Časové intervaly =====

      Opakovaně použitelné intervaly se definují v Notifikace → Časové intervaly. Každý interval má název, časové pásmo IANA (například ''Europe/Prague'') a jednu nebo více specifikací.

      {{:cs:screenshots:vpsadmin:notifications:time-interval.png?900|Nastavení časového intervalu}}

      V jedné specifikaci musí současně odpovídat všechna vyplněná pole. Více rozsahů v jednom poli představuje alternativy a více specifikací je rovněž spojeno logickým **nebo**. K dispozici jsou:

        * časy ve formátu ''HH:MM-HH:MM'', se začátkem včetně a koncem bez posledního okamžiku,
        * dny v týdnu zadané anglicky, například ''monday-friday'',
        * dny měsíce; záporná čísla počítají od konce měsíce (''-1'' je poslední den),
        * měsíce a roky jako čísla nebo rozsahy ''začátek:konec''.

      Časový rozsah ani rozsah dnů v týdnu se nesmí přetočit přes konec. Noční interval proto rozdělte na dvě specifikace, například ''22:00-24:00'' a ''00:00-06:00''; pokud omezujete dny v týdnu, druhou část přiřaďte následujícímu dni.

      ===== Aktivní a ztlumující intervaly rout =====

      Interval se k routě přiřazuje v Notifikace → Routy → upravit routu v režimu **Aktivní interval** nebo **Ztlumující interval**.

      {{:cs:screenshots:vpsadmin:notifications:route-time-intervals.png?900|Interval přiřazený k routě}}

        * Bez přiřazeného aktivního intervalu není aktivní doba routy omezena.
        * Je-li přiřazeno více aktivních intervalů, stačí shoda alespoň jednoho.
        * Shoda kteréhokoli ztlumujícího intervalu doručení vždy potlačí.
        * Interval řídí jen příjemce dané routy. Podřízené routy se dále vyhodnotí a nastavení pokračování routy zůstává zachováno.

      Na účet lze vytvořit nejvýše 50 intervalů. Interval může obsahovat nejvýše 20 specifikací a každé pole nejvýše 20 rozsahů. K jedné routě lze přiřadit nejvýše 20 intervalů. Použitý interval nelze smazat, dokud jej neodeberete ze všech rout.

      ===== Kontrola doručení =====

      Výsledek najdete v Notifikace → Události → detail události. Detail ukazuje odpovídající routy, stav časových intervalů a snímek jejich vyhodnocení v čase vzniku události. Stav ''inactive'' znamená, že neodpovídal žádný aktivní interval; ''muted'' znamená shodu ztlumujícího intervalu.

      {{:cs:screenshots:vpsadmin:notifications:event-suppressed.png?900|Událost potlačená časovým intervalem}}

      Pro bezpečné ověření nové konfigurace lze vytvořit **Testovací událost** bez čekání na skutečný incident.

  - language: en
    page: manuals:notifications
    body: |
      ====== Notifications ======

      The vpsAdmin notification system processes events and sends them to receivers according to routes. Open it from the main Notifications menu.

      The basic flow is **event → route → receiver → target**:

        * an **event** describes what happened and contains a type, severity and additional data,
        * a **route** selects events by type and optional matchers,
        * a **receiver** defines what should happen to a selected event,
        * a **target** is a specific e-mail address, webhook, telephone number or Telegram account.

      ===== Routes =====

      Manage routes at Notifications → Routes. Routes are evaluated in order. A route can continue to another matching route, contain child routes, or expire after its first use. Default routes provide normal delivery to the primary e-mail address; you can add custom routes or select the **Mute** receiver.

      {{:en:screenshots:vpsadmin:notifications:routes.png?900|Notification routes}}

      Route matchers compare event fields. Every matcher on one route has to match. When a route selects a specific event type, its field and operator choices adapt to the data declared by that type.

      ===== Receivers and contacts =====

      A receiver at Notifications → Receivers groups one or more targets. One receiver can therefore send an e-mail and call a webhook at the same time. The **Default** target uses the account's current primary e-mail address. Add other e-mail addresses as custom targets; they have to be verified before use.

      {{:en:screenshots:vpsadmin:notifications:receiver.png?900|Receiver configuration}}

      A receiver can be disabled without removing its routes. The **Mute** receiver creates no outgoing delivery. An event that reaches normal event processing remains in the event log; muting an OOM report at the ''raw'' stage, described below, is a special case.

      ===== Practical examples =====

      The following examples use custom receivers and routes. Enable **Continue** when an event should also pass through later matching routes. Put mute routes before delivery routes and leave **Continue** disabled on them.

      ==== Route by event role ====

      The ''roles'' field is a list of contact roles for which the event is intended. ''account'' identifies the account-management contact and ''admin'' the system administrator. One event can carry both roles, so use **contains list item**, not a comparison of the whole list.

      First create and verify two e-mail targets, then add them to **Account contact** and **Administrator contact** receivers. Create these routes:

      ^ Event type ^ Field ^ Operator ^ Value ^ Receiver ^ Continue ^
      | //any// | ''roles'' | contains list item | ''account'' | Account contact | yes |
      | //any// | ''roles'' | contains list item | ''admin'' | Administrator contact | yes |

      {{:en:screenshots:vpsadmin:notifications:example-role-routing.png?900|Routing by event role}}

      **Continue** lets an event with both roles reach both contacts and preserves any other matching delivery routes.

      ==== Mute selected OOM and incident reports ====

      Use the **Mute** receiver and two separate routes. This example mutes OOM reports for VPS ''123'' from user scopes, and incident reports for the same VPS with codename ''abuse-feed'':

      ^ Event type ^ Matchers (all must match) ^ Receiver ^ Continue ^
      | ''vps.oom_report'' | ''vps_id == 123''; ''stage == raw''; ''cgroup =* /user.slice/*.scope'' | Mute | no |
      | ''vps.incident_report'' | ''vps_id == 123''; ''codename == abuse-feed'' | Mute | no |

      The ''=*'' operator means **matches glob**. The cgroup value is the full path without a ''/sys/fs/cgroup'' prefix. Incident codenames are assigned by their source; copy the exact value from the detail of a real incident in the event log.

      {{:en:screenshots:vpsadmin:notifications:example-mute-oom.png?900|Muting OOM reports by cgroup}}

      The ''stage == raw'' matcher is essential for OOM reports. It evaluates the route as each report arrives and marks the report ignored, so it does not enter a later notification batch. This transient ''raw'' event is not stored in the event log. Without the ''stage'' matcher, the route could mute the resulting notification but would not prevent the report from being batched.

      Put mute routes before general delivery routes and leave **Continue** disabled. Use **Test event** and the route hit count to check the configuration; use values from a real OOM report when checking a cgroup path.

      ==== Send monitoring and incidents to Telegram ====

      Create a **Telegram** target, open its pairing link in a private chat with the bot, and press Start to complete pairing. Add the paired target to an **Operations Telegram** receiver.

      Create two routes:

      ^ Event selection ^ Receiver ^ Continue ^
      | pattern ''monitoring.*'' | Operations Telegram | yes |
      | type ''vps.incident_report'' | Operations Telegram | yes |

      {{:en:screenshots:vpsadmin:notifications:example-telegram.png?900|Telegram for monitoring and incident events}}

      The pattern catches every event type starting with ''monitoring.''. The second route adds incident reports. **Continue** keeps the default e-mail routes working as well. Re-pairing pauses Telegram delivery until the bot confirms the new pairing.

      ==== Send SMS on account or VPS suspension ====

      Create an **SMS** target, enter the number in international E.164 format (for example ''+420123456789''), send a verification SMS and enter its code. Add the verified target to a **Suspension SMS** receiver.

      ^ Event type ^ Receiver ^ Continue ^
      | ''user.suspended'' | Suspension SMS | yes |
      | ''vps.suspended'' | Suspension SMS | yes |

      {{:en:screenshots:vpsadmin:notifications:example-sms.png?900|SMS on account or VPS suspension}}

      The first route reports suspension of the whole account, while the second reports suspension of an individual VPS. **Continue** preserves the normal e-mail notifications.

      ==== Webhook on VPS resource changes ====

      Create a **Webhook** target with a public HTTPS URL and a random HMAC secret. Add it to a **Resource-change webhook** receiver, then create a route for ''vps.resources_changed'' with **Continue** enabled.

      {{:en:screenshots:vpsadmin:notifications:example-webhook.png?900|Webhook for VPS resource changes}}

      vpsAdmin sends a ''POST'' request with a JSON body and these headers:

        * ''Content-Type: application/json'',
        * ''User-Agent: vpsAdmin notification dispatcher'',
        * ''X-VpsAdmin-Event: vps.resources_changed'',
        * ''X-VpsAdmin-Delivery: <delivery ID>'',
        * ''X-VpsAdmin-Signature-256: sha256=<HMAC>'' when the target has a secret.

      HMAC-SHA256 is calculated from the unmodified request-body bytes. This small server verifies the signature, prints the received JSON and returns a successful ''204'' response. It listens on localhost only; put it behind a public HTTPS reverse proxy for real use.

      <code python>
      import hashlib
      import hmac
      import json
      import os
      from http.server import BaseHTTPRequestHandler, HTTPServer

      SECRET = os.environ["VPSADMIN_WEBHOOK_SECRET"].encode()


      class Handler(BaseHTTPRequestHandler):
          def do_POST(self):
              length = int(self.headers.get("Content-Length", "0"))
              body = self.rfile.read(length)
              expected = "sha256=" + hmac.new(
                  SECRET, body, hashlib.sha256
              ).hexdigest()
              received = self.headers.get("X-VpsAdmin-Signature-256", "")

              if not hmac.compare_digest(received, expected):
                  self.send_response(401)
                  self.end_headers()
                  return

              print(json.dumps(json.loads(body), indent=2))
              self.send_response(204)
              self.end_headers()


      HTTPServer(("127.0.0.1", 8080), Handler).serve_forever()
      </code>

      Run it with the same secret configured on the target:

      <code>
      VPSADMIN_WEBHOOK_SECRET='a-long-random-secret' python3 webhook.py
      </code>

      The request body looks like this (IDs and values are illustrative):

      <code json>
      {
        "event": {
          "id": 48123,
          "type": "vps.resources_changed",
          "category": "vps",
          "severity": "info",
          "subject": "VPS #123 resources changed",
          "summary": "Memory upgrade",
          "payload": {
            "vps_id": 123,
            "vps_hostname": "web.example",
            "cpu": 4,
            "cpu_limit": 400,
            "memory": 8192,
            "swap": 2048,
            "reason": "Memory upgrade",
            "admin_id": 1,
            "admin_name": "Example Admin"
          },
          "fields": {
            "event_type": "vps.resources_changed",
            "default_routed": true,
            "category": "vps",
            "severity": "info",
            "subject": "VPS #123 resources changed",
            "summary": "Memory upgrade",
            "roles": ["admin"],
            "subject_relation": "self",
            "subject_user_id": 42,
            "subject_is_self": true,
            "subject_is_admin_visible": false,
            "vps_id": 123,
            "vps_hostname": "web.example",
            "cpu": 4,
            "cpu_limit": 400,
            "memory": 8192,
            "swap": 2048,
            "reason": "Memory upgrade",
            "admin_id": 1,
            "admin_name": "Example Admin"
          },
          "ip_addr": null,
          "source": {"class": null, "id": null},
          "user": {"id": 42, "login": "example"},
          "vps": {"id": 123, "hostname": "web.example"},
          "created_at": "2026-07-23T14:15:16+02:00"
        },
        "delivery": {
          "id": 73001,
          "action": "webhook",
          "route": {
            "id": 91,
            "label": "Resource-change webhook",
            "matcher_summary": "vps.resources_changed"
          },
          "receiver": {
            "id": 37,
            "label": "Resource-change webhook"
          },
          "notification_target": {
            "id": 58,
            "label": "Resource-change webhook",
            "display_target": "https://events.example.test/vpsadmin"
          },
          "receiver_target": {"id": 64}
        }
      }
      </code>

      The target must be reachable from vpsAdmin. Private, local and link-local addresses are normally rejected, so do not use ''127.0.0.1'' or a home-LAN address as the target URL. Any ''2xx'' response is successful. Failed deliveries may be retried, so make processing idempotent using ''delivery.id'' or the ''X-VpsAdmin-Delivery'' header.

      ===== Time intervals =====

      Define reusable intervals at Notifications → Time intervals. Every interval has a name, an IANA time zone (for example ''Europe/Prague''), and one or more specifications.

      {{:en:screenshots:vpsadmin:notifications:time-interval.png?900|Time interval configuration}}

      Within one specification, every filled dimension must match. Multiple ranges in one dimension are alternatives, and multiple specifications are also joined with logical **OR**. The available dimensions are:

        * times in ''HH:MM-HH:MM'' format, inclusive at the start and exclusive at the end,
        * weekdays written in English, for example ''monday-friday'',
        * days of month; negative values count from the end (''-1'' is the last day),
        * months and years as numbers or ''start:end'' ranges.

      Time and weekday ranges cannot wrap. Split an overnight interval into two specifications, for example ''22:00-24:00'' and ''00:00-06:00''; when weekdays are constrained, assign the second part to the following day.

      ===== Active and mute route intervals =====

      Assign an interval to a route at Notifications → Routes → edit route, using **Active interval** or **Mute interval** mode.

      {{:en:screenshots:vpsadmin:notifications:route-time-intervals.png?900|Interval assigned to a route}}

        * With no active interval assigned, the route's active time is unrestricted.
        * With multiple active intervals, a match of any one is sufficient.
        * A matching mute interval always suppresses delivery.
        * An interval gates only that route's receiver. Child routes are still evaluated and the route's continue behavior is preserved.

      An account can define at most 50 intervals. An interval can contain at most 20 specifications and each dimension at most 20 ranges. At most 20 intervals can be assigned to one route. An interval in use cannot be deleted until it is unassigned from every route.

      ===== Checking delivery =====

      Inspect the result at Notifications → Event log → event detail. The detail shows matching routes, the time-interval state and the evaluation snapshot at the event timestamp. ''inactive'' means no active interval matched; ''muted'' means a mute interval matched.

      {{:en:screenshots:vpsadmin:notifications:event-suppressed.png?900|Event suppressed by a time interval}}

      Use **Test event** to verify a new configuration safely without waiting for a real incident.

replacements:
  - language: cs
    page: navody:vps:uzivatele
    path: notifications.open
    before: |-
      ===== Konfigurace e-mailových adres =====
      vpsAdmin umožňuje nastavit jeden primární e-mail patřící majiteli účtu --
      členovi v našem spolku. Ten musí být nastaven a může být jen jeden. Krom toho je
      možné nastavit různé e-mailové adresy pro různé typy kontaktů -- např. účetní a
      správce VPS. Toto nastavení lze měnit v detailech uživatelského účtu
      (<vpsadmin-nav id="member.edit-profile.open">vpsAdmin -> Upravit profil</vpsadmin-nav>).

      {{:cs:screenshots:vpsadmin:account:email-roles.png?300|}}

      Například, správce členství (role Vedení účtu) dostává následující
      maily:

        * upozornění k platbě členského příspěvku,
        * pozastavení/obnovení členství,
        * potvrzení přijetí platby.

      Správce VPS (role Správce systému) pak maily o:

        * změně stavu VPS,
        * změně konfigurace VPS,
        * stahování záloh,
        * migrace VPS.

      ==== Detailní nastavení ====
      Komu by nestačilo nastavení různých e-mailových adres pro různé role, nebo
      některé e-maily nechce vůbec dostávat, existuje ještě pokročilé nastavení
      (<vpsadmin-nav id="member.advanced-email-configuration.open">vpsAdmin -> Upravit profil -> Pokročilá konfigurace e-mailu</vpsadmin-nav>). Zde si můžete
      nastavit libovolné adresy pro vybrané typy e-mailů, případně zasílání zrušit
      úplně.

      {{:cs:screenshots:vpsadmin:account:mail-template-recipients.png?300|}}
    body: vpsAdmin → Notifikace
    replacement: |-
      ===== E-mailová adresa a notifikace =====
      Primární e-mailová adresa patří majiteli účtu — členovi spolku. Je povinná,
      může být pouze jedna a mění se v nastavení účtu (vpsAdmin → Upravit profil).

      Doručování provozních zpráv se nyní nastavuje pomocí událostí, rout, příjemců
      a cílů. Výchozí e-mailový cíl používá primární adresu; další adresy lze přidat
      a ověřit jako vlastní cíle. Postup včetně ztlumení vybraných událostí popisuje
      návod <vpsadmin-nav id="notifications.open">vpsAdmin → Notifikace</vpsadmin-nav>.
