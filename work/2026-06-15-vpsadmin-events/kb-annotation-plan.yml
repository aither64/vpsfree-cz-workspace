schema: 2
new_pages:
  - language: cs
    page: navody:notifikace
    body: |
      <page>manuals:notifications</page>
      ====== Notifikace ======

      Notifikační systém vpsAdminu zpracovává události a podle rout je předává příjemcům. Nastavení najdete v hlavní nabídce Notifikace.

      Základní tok je **událost → routa → příjemce → cíl**:

        * **událost** popisuje, co se stalo,
        * **routa** vybírá události podle typu a podmínek,
        * **příjemce** sdružuje způsob doručení,
        * **cíl** je konkrétní e-mail, telefon, Telegram nebo webhook.

      Routy se vyhodnocují shora dolů. Doručovací routy obvykle používají **Pokračovat: ano**, aby mohly fungovat i další routy. Ztlumující routy patří před ně a používají **Pokračovat: ne**, aby se vyhodnocování zastavilo.

      ===== Příklady krok za krokem =====

      ==== 1. Doručení podle role události ====

      **Cíl:** události určené roli ''account'' posílat kontaktu pro vedení účtu a události pro roli ''admin'' správci systému. Jedna událost může mít obě role.

        - V části **Cíle** přidejte dva e-mailové cíle. Zadejte popisný název, e-mailovou adresu a každý cíl ověřte odkazem z ověřovací zprávy.
        - V části **Příjemci** vytvořte příjemce **Kontakt účtu**. Otevřete jej, vyberte první ověřený e-mailový cíl a klikněte na **Přidat cíl**. Stejným způsobem vytvořte příjemce **Kontakt správce** pro druhou adresu.

      {{:cs:screenshots:vpsadmin:notifications:example-role-receiver.png?900|E-mailový cíl připojený k příjemci Kontakt účtu}}

        - V části **Routy** klikněte na **Přidat routu** a nastavte:
          * **Název:** ''Události role account'',
          * **Typ události** i **Vzor typu události:** ponechte prázdné,
          * **Příjemce:** Kontakt účtu,
          * **Povoleno:** ano,
          * **Pokračovat:** ano.
        - Po uložení routy klikněte na **Přidat matcher**. V nabídce typu zvolte **Libovolný typ události**, pole ''roles'', operátor **obsahuje položku seznamu** a hodnotu ''account''.

      {{:cs:screenshots:vpsadmin:notifications:example-role-routing.png?900|Routa pro roli account včetně podmínky roles}}

        - Přidejte druhou routu stejným postupem. Použijte název ''Události role admin'', příjemce **Kontakt správce**, hodnotu podmínky ''admin'' a opět **Pokračovat: ano**.

      {{:cs:screenshots:vpsadmin:notifications:example-role-admin-route.png?900|Routa pro roli admin včetně podmínky roles}}

        - Obě routy přesuňte před obecné výchozí routy. Protože pokračují, událost může dorazit na oba kontakty a současně i na další příjemce.
        - Pro kontrolu otevřete **Testovací událost**, vyberte typ ''user.test_notification'' a přepište jeho role v payloadu:

      <code json>
      {
        "roles": ["account", "admin"],
        "note": "Role routing test"
      }
      </code>

        - Po vytvoření testu otevřete jeho detail v **Událostech**. V tabulce odpovídajících rout musí být obě routy. Testovací událost skutečně odešle zprávy nakonfigurovaným cílům.

      {{:cs:screenshots:vpsadmin:notifications:example-role-result.png?900|Testovací událost odpovídající routám account i admin}}

      ==== 2. Ztlumení vybraných OOM reportů a incidentů ====

      **Cíl:** na VPS ''123'' ignorovat OOM reporty z uživatelských scope a incidenty se zdrojem ''abuse-feed''. Použije se vestavěný příjemce **Ztlumit**, takže není potřeba vytvářet cíl.

        - V části **Routy** přidejte routu **Ztlumit vybrané OOM reporty**.
        - Nastavte typ ''vps.oom_report'', příjemce **Ztlumit**, **Povoleno: ano** a **Pokračovat: ne**.
        - Po uložení přidejte tři podmínky; všechny musí platit současně:

      ^ Pole ^ Operátor ^ Hodnota ^
      | ''vps_id'' | rovná se | ''123'' |
      | ''stage'' | rovná se | ''raw'' |
      | ''cgroup'' | odpovídá glob vzoru | %%/user.slice/**/*.scope%% |

      {{:cs:screenshots:vpsadmin:notifications:example-mute-oom.png?900|Ztlumení OOM reportů podle VPS, fáze a cgroup}}

      Hodnota ''cgroup'' je úplná cesta bez prefixu ''/sys/fs/cgroup''. Operátor glob dovoluje, aby %%**%% odpovídalo více úrovním adresářů. Podmínka ''stage == raw'' označí jednotlivý OOM report jako ignorovaný ještě před vytvořením pozdější souhrnné notifikace. Skutečná přechodná událost ve fázi ''raw'' se do přehledu neukládá.

        - Přidejte druhou routu **Ztlumit incidentní zdroj pro VPS**.
        - Nastavte typ ''vps.incident_report'', příjemce **Ztlumit**, **Povoleno: ano**, **Pokračovat: ne** a podmínky:

      ^ Pole ^ Operátor ^ Hodnota ^
      | ''vps_id'' | rovná se | ''123'' |
      | ''codename'' | rovná se | ''abuse-feed'' |

      {{:cs:screenshots:vpsadmin:notifications:example-mute-incident-route.png?900|Ztlumení incidentů podle ID VPS a kódového označení}}

      Hodnotu ''codename'' zkopírujte z detailu skutečného incidentu v přehledu událostí. Není to předmět ani text incidentu, ale stabilní označení jeho zdroje.

        - Obě ztlumující routy přesuňte nad doručovací a výchozí routy. **Pokračovat** musí zůstat vypnuté.
        - Incidentní routu ověřte testovací událostí ''vps.incident_report'':

      <code json>
      {
        "subject": "Documentation incident",
        "text": "Synthetic incident used to test routing.",
        "codename": "abuse-feed",
        "vps_id": 123
      }
      </code>

        - OOM routu lze ověřit testovací událostí ''vps.oom_report'' s hodnotami z reálného reportu:

      <code json>
      {
        "vps_id": 123,
        "stage": "raw",
        "cgroup": "/user.slice/user-1000.slice/session-2.scope",
        "cgroups": ["/user.slice/user-1000.slice/session-2.scope"],
        "count": 1
      }
      </code>

      Testovací události se pro kontrolu uloží i pro fázi ''raw''. V detailu musí být první odpovídající routou příslušná ztlumující routa a další routy se již nesmějí vyhodnotit.

      {{:cs:screenshots:vpsadmin:notifications:example-mute-result.png?900|Incident zastavený ztlumující routou}}

      ==== 3. Monitoring a incidenty do Telegramu ====

      **Cíl:** všechny typy ''monitoring.*'' a incidentní reporty posílat do soukromého chatu v Telegramu a ponechat zároveň běžné e-maily.

        - V části **Cíle** přidejte cíl typu **Telegram** s názvem **Provozní Telegram**.
        - Otevřete zobrazený párovací odkaz v soukromém chatu s botem, stiskněte Start a vraťte se do vpsAdminu. Stav cíle se musí změnit na **spárováno**. Párovací odkaz nikomu neposílejte.

      {{:cs:screenshots:vpsadmin:notifications:example-telegram-target.png?900|Spárovaný cíl Telegram}}

        - V části **Příjemci** vytvořte příjemce **Provozní Telegram**, otevřete jej a připojte k němu stejnojmenný cíl.

      {{:cs:screenshots:vpsadmin:notifications:example-telegram.png?900|Cíl Telegram připojený k příjemci}}

        - Přidejte routu **Monitoring do Telegramu**. Typ události ponechte prázdný, do **Vzoru typu události** zadejte ''monitoring.*'', vyberte příjemce **Provozní Telegram** a zapněte **Pokračovat**.

      {{:cs:screenshots:vpsadmin:notifications:example-telegram-monitoring-route.png?900|Telegramová routa pro monitoring.*}}

        - Přidejte routu **Incidenty do Telegramu**. Vyberte přesný typ ''vps.incident_report'', stejný příjemce a **Pokračovat: ano**.

      {{:cs:screenshots:vpsadmin:notifications:example-telegram-incident-route.png?900|Telegramová routa pro incidentní reporty}}

        - Obě routy přesuňte před výchozí e-mailové routy. Bezpečný test spojení provedete dočasnou routou pro přesný typ ''user.test_notification'', příjemce **Provozní Telegram** a **Pokračovat: ne**. Vytvořte testovací událost tohoto typu, zkontrolujte zprávu v Telegramu a dočasnou routu smažte.
        - Incidentní a monitoringovou routu ověřte po příští skutečné události v jejím detailu nebo pomocí počítadla zásahů. Syntetický incident nemá navázaný reálný incidentní záznam a některé konkrétní monitoringové typy rovněž vyžadují zdrojový objekt, proto pro ně obecný test nemusí vytvořit doručení.

      {{:cs:screenshots:vpsadmin:notifications:example-telegram-result.png?900|Testovací událost zastavená dočasnou telegramovou routou}}

      ==== 4. SMS při pozastavení účtu nebo VPS ====

      **Cíl:** odeslat SMS při pozastavení celého účtu i jednotlivé VPS a současně zachovat e-mailové oznámení.

        - V části **Cíle** přidejte cíl typu **SMS**. Zadejte číslo v mezinárodním formátu E.164, například ''+420123456789'', a uložte jej.
        - Odešlete ověřovací SMS a zapište přijatý kód. Routy používají pouze ověřený a povolený cíl.

      {{:cs:screenshots:vpsadmin:notifications:example-sms-verification.png?900|Ověření SMS cíle kódem}}

        - V části **Příjemci** vytvořte příjemce **SMS pozastavení**, otevřete jej a připojte ověřený SMS cíl.

      {{:cs:screenshots:vpsadmin:notifications:example-sms.png?900|Ověřený SMS cíl připojený k příjemci}}

        - Přidejte routu **SMS při pozastavení účtu** s typem ''user.suspended'', příjemcem **SMS pozastavení** a **Pokračovat: ano**.

      {{:cs:screenshots:vpsadmin:notifications:example-sms-account-route.png?900|SMS routa pro pozastavení účtu}}

        - Přidejte routu **SMS při pozastavení VPS** s typem ''vps.suspended'', stejným příjemcem a **Pokračovat: ano**.

      {{:cs:screenshots:vpsadmin:notifications:example-sms-vps-route.png?900|SMS routa pro pozastavení VPS}}

        - Routy umístěte před výchozí e-mailové routy. ''user.suspended'' se vztahuje na celý účet, zatímco ''vps.suspended'' na jednu VPS.
        - Volitelně vytvořte testovací událost ''user.suspended'' s payloadem ''{"state":"suspended","reason":"Routing test"}''. Test účet nepozastaví, ale odešle skutečnou SMS, která může být zpoplatněna jako běžná SMS.
        - Routa ''vps.suspended'' se ověří při příští skutečné události v detailu nebo počítadlem zásahů. Obecná testovací událost není spojena s reálnou VPS, kterou šablona této zprávy potřebuje.

      {{:cs:screenshots:vpsadmin:notifications:example-sms-result.png?900|Test pozastavení účtu odpovídající SMS routě}}

      ==== 5. Webhook při změně prostředků VPS ====

      **Cíl:** při události ''vps.resources_changed'' odeslat podepsaný JSON na vlastní HTTPS endpoint.

        - Nejprve připravte veřejný HTTPS endpoint. Pro test lze následující Python server spustit za reverzní proxy; přímo poslouchá jen na ''127.0.0.1:8080''.

      <code python>
      import hashlib
      import hmac
      import json
      import os
      from http.server import BaseHTTPRequestHandler, HTTPServer

      SECRET = os.environ["VPSADMIN_WEBHOOK_SECRET"].encode()


      class Handler(BaseHTTPRequestHandler):
          def do_POST(self):
              length = int(self.headers.get("Content-Length", "0"))
              body = self.rfile.read(length)
              expected = "sha256=" + hmac.new(
                  SECRET, body, hashlib.sha256
              ).hexdigest()
              received = self.headers.get("X-VpsAdmin-Signature-256", "")

              if not hmac.compare_digest(received, expected):
                  self.send_response(401)
                  self.end_headers()
                  return

              data = json.loads(body)
              delivery = str(data["delivery"]["id"])
              if self.headers.get("X-VpsAdmin-Delivery") != delivery:
                  self.send_response(400)
                  self.end_headers()
                  return

              print("event:", self.headers.get("X-VpsAdmin-Event"))
              print("delivery:", delivery)
              print(json.dumps(data, indent=2))
              self.send_response(204)
              self.end_headers()


      HTTPServer(("127.0.0.1", 8080), Handler).serve_forever()
      </code>

        - Vygenerujte dlouhé náhodné tajemství, bezpečně si je uložte a spusťte server:

      <code>
      export VPSADMIN_WEBHOOK_SECRET="$(openssl rand -hex 32)"
      printf '%s\n' "$VPSADMIN_WEBHOOK_SECRET"
      python3 webhook.py
      </code>

        - V části **Cíle** přidejte cíl typu **Webhook**. Zadejte veřejnou URL, například ''https://events.example.net/vpsadmin'', a vygenerované tajemství. Privátní, lokální a link-local adresy vpsAdmin odmítá.

      {{:cs:screenshots:vpsadmin:notifications:example-webhook-target.png?900|Webhookový cíl s veřejnou URL a HMAC tajemstvím}}

        - V části **Příjemci** vytvořte **Webhook změn prostředků** a připojte k němu webhookový cíl.

      {{:cs:screenshots:vpsadmin:notifications:example-webhook.png?900|Webhookový cíl připojený k příjemci}}

        - Přidejte routu **Webhook změn prostředků VPS** s typem ''vps.resources_changed'', tímto příjemcem a **Pokračovat: ano**.

      {{:cs:screenshots:vpsadmin:notifications:example-webhook-route.png?900|Webhooková routa pro změny prostředků VPS}}

        - Pro test přesuňte webhookovou routu na první místo a dočasně u ní vypněte **Pokračovat**. Tím se syntetická událost nedostane k běžným e-mailovým routám, jejichž šablona vyžaduje reálnou VPS. V **Testovací události** zvolte ''vps.resources_changed'' a například:

      <code json>
      {
        "vps_id": 123,
        "vps_hostname": "example-vps",
        "cpu": 4,
        "cpu_limit": 400,
        "memory": 8192,
        "swap": 2048,
        "reason": "Memory upgrade"
      }
      </code>

        - Po vytvoření testu server obdrží ''POST'' s ''Content-Type: application/json'', ''User-Agent: vpsAdmin notification dispatcher'' a hlavičkami ''X-VpsAdmin-Event'', ''X-VpsAdmin-Delivery'' a ''X-VpsAdmin-Signature-256''. V detailu události musí být webhooková routa jedinou odpovídající routou. Potom u ní znovu zapněte **Pokračovat**, aby skutečné změny prostředků nadále vyvolaly i běžný e-mail.

      {{:cs:screenshots:vpsadmin:notifications:example-webhook-result.png?900|Test změny prostředků zastavený webhookovou routou}}

      Přijaté tělo vypadá například takto (ID jsou pouze ilustrační):

      <code json>
      {
        "event": {
          "id": 48123,
          "type": "vps.resources_changed",
          "category": "vps",
          "severity": "info",
          "subject": "Test notification",
          "summary": null,
          "payload": {
            "roles": ["admin"],
            "vps_id": 123,
            "vps_hostname": "example-vps",
            "cpu": 4,
            "cpu_limit": 400,
            "memory": 8192,
            "swap": 2048,
            "reason": "Memory upgrade"
          },
          "fields": {
            "event_type": "vps.resources_changed",
            "default_routed": true,
            "category": "vps",
            "severity": "info",
            "subject": "Test notification",
            "roles": ["admin"],
            "subject_relation": "self",
            "subject_user_id": 42,
            "subject_is_self": true,
            "subject_is_admin_visible": false,
            "vps_id": 123,
            "vps_hostname": "example-vps",
            "cpu": 4,
            "cpu_limit": 400,
            "memory": 8192,
            "swap": 2048,
            "reason": "Memory upgrade"
          },
          "ip_addr": null,
          "source": {
            "class": "VpsAdmin::API::Resources::Event::Test",
            "id": null
          },
          "user": {"id": 42, "login": "example"},
          "vps": null,
          "created_at": "2026-07-23T14:15:16+02:00"
        },
        "delivery": {
          "id": 73001,
          "action": "webhook",
          "route": {
            "id": 91,
            "label": "Webhook změn prostředků VPS",
            "matcher_summary": "vps.resources_changed"
          },
          "receiver": {
            "id": 37,
            "label": "Webhook změn prostředků"
          },
          "notification_target": {
            "id": 58,
            "label": "Endpoint změn prostředků",
            "display_target": "https://events.example.net/vpsadmin"
          },
          "receiver_target": {"id": 64}
        }
      }
      </code>

      Podpis je HMAC-SHA256 z nezměněných bajtů těla a má tvar ''sha256=<HMAC>''. Libovolná odpověď ''2xx'' znamená úspěch. Neúspěšné doručení se může opakovat, proto požadavky zpracovávejte idempotentně podle podepsané hodnoty ''delivery.id'' v těle. Hlavička ''X-VpsAdmin-Delivery'' není sama podepsaná; server výše ji proto přijme jen tehdy, když se shoduje s ''delivery.id''.

      ===== Referenční přehled =====

      ==== Routy a podmínky ====

      Routy se spravují v Notifikace → Routy. Při vytvoření se nejdříve uloží základní routa; podmínky se přidávají až na její editační stránce. Všechny podmínky jedné routy musí platit současně. Typ události je přesná hodnota, zatímco vzor typu může použít glob, například ''monitoring.*''.

      Pořadí měňte šipkami nebo přetažením. **Pokračovat: ano** předá událost dalším odpovídajícím routám. **Pokračovat: ne** zpracování na dané úrovni zastaví, což je důležité u příjemce **Ztlumit**.

      ==== Cíle a příjemci ====

      Cíle se spravují v nabídce Notifikace → Cíle. Cíl obsahuje konkrétní adresu nebo účet a svůj ověřovací stav. Příjemce sdružuje jeden či více cílů; jeden příjemce tak může například odeslat e-mail i zavolat webhook.

      Příjemci se spravují v Notifikace → Příjemci. Výchozí e-mailový cíl sleduje primární adresu účtu. Vlastní e-mail, SMS a Telegram musí být před doručováním ověřeny nebo spárovány.

      {{:cs:screenshots:vpsadmin:notifications:receiver.png?900|Nastavení příjemce a jeho cílů}}

      ==== Časové intervaly ====

      Opakovaně použitelné intervaly se definují v Notifikace → Časové intervaly. Každý má časové pásmo IANA a jednu či více specifikací. Pole jedné specifikace se spojují logickým **a**; více rozsahů nebo specifikací představuje alternativy.

      {{:cs:screenshots:vpsadmin:notifications:time-interval.png?900|Nastavení časového intervalu}}

      Interval se přiřazuje v Notifikace → Routy → upravit routu jako **Aktivní interval** nebo **Ztlumující interval**. Bez aktivního intervalu není doba routy omezena; shoda kteréhokoli ztlumujícího intervalu potlačí doručení dané routy.

      {{:cs:screenshots:vpsadmin:notifications:route-time-intervals.png?900|Interval přiřazený k routě}}

      ==== Události a kontrola doručení ====

      Výsledek najdete v Notifikace → Události → detail události. Detail ukazuje odpovídající routy, stav časových intervalů, vytvořená doručení a snímek vyhodnocení v čase události. ''inactive'' znamená, že neodpovídal aktivní interval; ''muted'' znamená shodu ztlumujícího intervalu.

      {{:cs:screenshots:vpsadmin:notifications:event-suppressed.png?900|Událost potlačená časovým intervalem}}

      **Testovací událost** umožní vyzkoušet routování bez skutečného pozastavení nebo incidentu, ale její doručení je skutečné: může odeslat e-mail, zprávu Telegram, SMS nebo požadavek na webhook.

  - language: en
    page: manuals:notifications
    body: |
      ====== Notifications ======

      The vpsAdmin notification system processes events and passes them to receivers according to routes. Open it from the main Notifications menu.

      The basic flow is **event → route → receiver → target**:

        * an **event** describes what happened,
        * a **route** selects events by type and matchers,
        * a **receiver** groups the delivery behavior,
        * a **target** is a specific e-mail, telephone, Telegram account or webhook.

      Routes are evaluated from top to bottom. Delivery routes normally use **Continue: yes**, allowing later routes to work as well. Mute routes belong before them and use **Continue: no**, stopping further evaluation.

      ===== Step-by-step examples =====

      ==== 1. Route by event role ====

      **Goal:** send events intended for the ''account'' role to the account-management contact and events for the ''admin'' role to the system administrator. One event can carry both roles.

        - Under **Targets**, add two e-mail targets. Give each a descriptive label and e-mail address, then verify each target using the link from its verification message.
        - Under **Receivers**, create an **Account contact** receiver. Open it, select the first verified e-mail target and click **Add target**. Repeat this for an **Administrator contact** receiver and the second address.

      {{:en:screenshots:vpsadmin:notifications:example-role-receiver.png?900|E-mail target attached to the Account contact receiver}}

        - Under **Routes**, click **Add route** and set:
          * **Label:** ''Account-role notifications'',
          * **Event type** and **Event type pattern:** leave both empty,
          * **Receiver:** Account contact,
          * **Enabled:** yes,
          * **Continue:** yes.
        - After saving the route, click **Add matcher**. In the type selector choose **Any event type**, field ''roles'', operator **contains list item**, and value ''account''.

      {{:en:screenshots:vpsadmin:notifications:example-role-routing.png?900|Account-role route including its roles matcher}}

        - Add the second route in the same way. Use label ''Admin-role notifications'', receiver **Administrator contact**, matcher value ''admin'', and **Continue: yes**.

      {{:en:screenshots:vpsadmin:notifications:example-role-admin-route.png?900|Admin-role route including its roles matcher}}

        - Move both routes before general default routes. Because they continue, an event can reach both contacts as well as other receivers.
        - To verify the result, open **Test event**, select ''user.test_notification'', and override its roles in the payload:

      <code json>
      {
        "roles": ["account", "admin"],
        "note": "Role routing test"
      }
      </code>

        - Open the created event from **Event log**. Its matched-routes table must contain both routes. A test event performs real deliveries to the configured targets.

      {{:en:screenshots:vpsadmin:notifications:example-role-result.png?900|Test event matching both the account and admin routes}}

      ==== 2. Mute selected OOM and incident reports ====

      **Goal:** on VPS ''123'', ignore OOM reports from user scopes and incidents from source ''abuse-feed''. This uses the built-in **Mute** receiver, so no target has to be created.

        - Under **Routes**, add a **Mute selected OOM reports** route.
        - Set event type ''vps.oom_report'', receiver **Mute**, **Enabled: yes**, and **Continue: no**.
        - After saving, add these three matchers; all of them have to match:

      ^ Field ^ Operator ^ Value ^
      | ''vps_id'' | equals | ''123'' |
      | ''stage'' | equals | ''raw'' |
      | ''cgroup'' | matches glob | %%/user.slice/**/*.scope%% |

      {{:en:screenshots:vpsadmin:notifications:example-mute-oom.png?900|Muting OOM reports by VPS, stage and cgroup}}

      The ''cgroup'' value is the complete path without a ''/sys/fs/cgroup'' prefix. In the glob, %%**%% can match multiple directory levels. The ''stage == raw'' matcher marks each matching report ignored before it can enter a later notification batch. A real transient ''raw'' event is not stored in the event log.

        - Add a **Mute incident feed for VPS** route.
        - Set event type ''vps.incident_report'', receiver **Mute**, **Enabled: yes**, **Continue: no**, and add:

      ^ Field ^ Operator ^ Value ^
      | ''vps_id'' | equals | ''123'' |
      | ''codename'' | equals | ''abuse-feed'' |

      {{:en:screenshots:vpsadmin:notifications:example-mute-incident-route.png?900|Muting incidents by VPS ID and codename}}

      Copy ''codename'' from the detail of a real incident in the event log. It is a stable source identifier, not the incident subject or text.

        - Move both mute routes above delivery and default routes. **Continue** must remain disabled.
        - Verify the incident route with a ''vps.incident_report'' test event:

      <code json>
      {
        "subject": "Documentation incident",
        "text": "Synthetic incident used to test routing.",
        "codename": "abuse-feed",
        "vps_id": 123
      }
      </code>

        - The OOM route can be checked with a ''vps.oom_report'' test event using values from a real report:

      <code json>
      {
        "vps_id": 123,
        "stage": "raw",
        "cgroup": "/user.slice/user-1000.slice/session-2.scope",
        "cgroups": ["/user.slice/user-1000.slice/session-2.scope"],
        "count": 1
      }
      </code>

      Test events are persisted for inspection even at the ''raw'' stage. In the event detail, the appropriate mute route must be the first match and no later route may be evaluated.

      {{:en:screenshots:vpsadmin:notifications:example-mute-result.png?900|Incident stopped by its mute route}}

      ==== 3. Send monitoring and incidents to Telegram ====

      **Goal:** send every ''monitoring.*'' event and incident report to a private Telegram chat while keeping normal e-mail delivery.

        - Under **Targets**, add a **Telegram** target named **Operations Telegram**.
        - Open the displayed pairing link in a private chat with the bot, press Start, and return to vpsAdmin. The target status must change to **paired**. Do not share the pairing link.

      {{:en:screenshots:vpsadmin:notifications:example-telegram-target.png?900|Paired Telegram target}}

        - Under **Receivers**, create **Operations Telegram**, open it, and attach the target with the same name.

      {{:en:screenshots:vpsadmin:notifications:example-telegram.png?900|Telegram target attached to its receiver}}

        - Add a **Monitoring to Telegram** route. Leave Event type empty, set **Event type pattern** to ''monitoring.*'', choose **Operations Telegram**, and enable **Continue**.

      {{:en:screenshots:vpsadmin:notifications:example-telegram-monitoring-route.png?900|Telegram route for monitoring.*}}

        - Add an **Incident reports to Telegram** route. Select exact type ''vps.incident_report'', the same receiver, and **Continue: yes**.

      {{:en:screenshots:vpsadmin:notifications:example-telegram-incident-route.png?900|Telegram route for incident reports}}

        - Move both routes before the default e-mail routes. Safely test the connection with a temporary route for exact type ''user.test_notification'', receiver **Operations Telegram**, and **Continue: no**. Create a test event of that type, check the Telegram message, and delete the temporary route.
        - Verify the incident and monitoring routes after their next real event, using its event detail or the route hit count. A synthetic incident is not linked to a real incident record, and some concrete monitoring types also require a source object, so a generic test cannot always create their delivery.

      {{:en:screenshots:vpsadmin:notifications:example-telegram-result.png?900|Test event stopped by the temporary Telegram route}}

      ==== 4. Send SMS on account or VPS suspension ====

      **Goal:** send an SMS when the whole account or an individual VPS is suspended, while preserving the e-mail notification.

        - Under **Targets**, add an **SMS** target. Enter the number in international E.164 format, for example ''+420123456789'', and save it.
        - Send the verification SMS and enter the received code. Routes use only an enabled, verified target.

      {{:en:screenshots:vpsadmin:notifications:example-sms-verification.png?900|Verifying an SMS target with its code}}

        - Under **Receivers**, create **Suspension SMS**, open it, and attach the verified SMS target.

      {{:en:screenshots:vpsadmin:notifications:example-sms.png?900|Verified SMS target attached to its receiver}}

        - Add an **Account suspension SMS** route with event type ''user.suspended'', receiver **Suspension SMS**, and **Continue: yes**.

      {{:en:screenshots:vpsadmin:notifications:example-sms-account-route.png?900|SMS route for account suspension}}

        - Add a **VPS suspension SMS** route with event type ''vps.suspended'', the same receiver, and **Continue: yes**.

      {{:en:screenshots:vpsadmin:notifications:example-sms-vps-route.png?900|SMS route for VPS suspension}}

        - Place both routes before the default e-mail routes. ''user.suspended'' applies to the whole account, while ''vps.suspended'' applies to one VPS.
        - Optionally create a ''user.suspended'' test event with payload ''{"state":"suspended","reason":"Routing test"}''. The test suspends nothing, but it sends a real SMS and may incur the normal SMS charge.
        - Verify the ''vps.suspended'' route after the next real event in its detail or from the route hit count. A generic test event is not attached to the real VPS required by this message template.

      {{:en:screenshots:vpsadmin:notifications:example-sms-result.png?900|Account suspension test matching the SMS route}}

      ==== 5. Webhook on VPS resource changes ====

      **Goal:** send signed JSON to your own HTTPS endpoint for every ''vps.resources_changed'' event.

        - First prepare a public HTTPS endpoint. For a test, run this Python server behind a reverse proxy; it listens directly on ''127.0.0.1:8080'' only.

      <code python>
      import hashlib
      import hmac
      import json
      import os
      from http.server import BaseHTTPRequestHandler, HTTPServer

      SECRET = os.environ["VPSADMIN_WEBHOOK_SECRET"].encode()


      class Handler(BaseHTTPRequestHandler):
          def do_POST(self):
              length = int(self.headers.get("Content-Length", "0"))
              body = self.rfile.read(length)
              expected = "sha256=" + hmac.new(
                  SECRET, body, hashlib.sha256
              ).hexdigest()
              received = self.headers.get("X-VpsAdmin-Signature-256", "")

              if not hmac.compare_digest(received, expected):
                  self.send_response(401)
                  self.end_headers()
                  return

              data = json.loads(body)
              delivery = str(data["delivery"]["id"])
              if self.headers.get("X-VpsAdmin-Delivery") != delivery:
                  self.send_response(400)
                  self.end_headers()
                  return

              print("event:", self.headers.get("X-VpsAdmin-Event"))
              print("delivery:", delivery)
              print(json.dumps(data, indent=2))
              self.send_response(204)
              self.end_headers()


      HTTPServer(("127.0.0.1", 8080), Handler).serve_forever()
      </code>

        - Generate and safely store a long random secret, then start the server:

      <code>
      export VPSADMIN_WEBHOOK_SECRET="$(openssl rand -hex 32)"
      printf '%s\n' "$VPSADMIN_WEBHOOK_SECRET"
      python3 webhook.py
      </code>

        - Under **Targets**, add a **Webhook** target. Enter a public URL such as ''https://events.example.net/vpsadmin'' and the generated secret. vpsAdmin rejects private, local and link-local target addresses.

      {{:en:screenshots:vpsadmin:notifications:example-webhook-target.png?900|Webhook target with a public URL and HMAC secret}}

        - Under **Receivers**, create **Resource-change webhook** and attach the webhook target.

      {{:en:screenshots:vpsadmin:notifications:example-webhook.png?900|Webhook target attached to its receiver}}

        - Add a **VPS resource-change webhook** route with type ''vps.resources_changed'', this receiver, and **Continue: yes**.

      {{:en:screenshots:vpsadmin:notifications:example-webhook-route.png?900|Webhook route for VPS resource changes}}

        - For the test, move the webhook route to the first position and temporarily disable **Continue**. This prevents the synthetic event from reaching normal e-mail routes whose template requires a real VPS. Under **Test event**, select ''vps.resources_changed'' and use:

      <code json>
      {
        "vps_id": 123,
        "vps_hostname": "example-vps",
        "cpu": 4,
        "cpu_limit": 400,
        "memory": 8192,
        "swap": 2048,
        "reason": "Memory upgrade"
      }
      </code>

        - The server receives a ''POST'' with ''Content-Type: application/json'', ''User-Agent: vpsAdmin notification dispatcher'', and the ''X-VpsAdmin-Event'', ''X-VpsAdmin-Delivery'', and ''X-VpsAdmin-Signature-256'' headers. The webhook route must be the only matched route in the event detail. Re-enable **Continue** afterwards so real resource changes continue to produce the normal e-mail as well.

      {{:en:screenshots:vpsadmin:notifications:example-webhook-result.png?900|Resource-change test stopped by the webhook route}}

      The received body looks like this (IDs are illustrative):

      <code json>
      {
        "event": {
          "id": 48123,
          "type": "vps.resources_changed",
          "category": "vps",
          "severity": "info",
          "subject": "Test notification",
          "summary": null,
          "payload": {
            "roles": ["admin"],
            "vps_id": 123,
            "vps_hostname": "example-vps",
            "cpu": 4,
            "cpu_limit": 400,
            "memory": 8192,
            "swap": 2048,
            "reason": "Memory upgrade"
          },
          "fields": {
            "event_type": "vps.resources_changed",
            "default_routed": true,
            "category": "vps",
            "severity": "info",
            "subject": "Test notification",
            "roles": ["admin"],
            "subject_relation": "self",
            "subject_user_id": 42,
            "subject_is_self": true,
            "subject_is_admin_visible": false,
            "vps_id": 123,
            "vps_hostname": "example-vps",
            "cpu": 4,
            "cpu_limit": 400,
            "memory": 8192,
            "swap": 2048,
            "reason": "Memory upgrade"
          },
          "ip_addr": null,
          "source": {
            "class": "VpsAdmin::API::Resources::Event::Test",
            "id": null
          },
          "user": {"id": 42, "login": "example"},
          "vps": null,
          "created_at": "2026-07-23T14:15:16+02:00"
        },
        "delivery": {
          "id": 73001,
          "action": "webhook",
          "route": {
            "id": 91,
            "label": "VPS resource-change webhook",
            "matcher_summary": "vps.resources_changed"
          },
          "receiver": {
            "id": 37,
            "label": "Resource-change webhook"
          },
          "notification_target": {
            "id": 58,
            "label": "Resource-change endpoint",
            "display_target": "https://events.example.net/vpsadmin"
          },
          "receiver_target": {"id": 64}
        }
      }
      </code>

      The signature is HMAC-SHA256 over the unmodified body bytes and has form ''sha256=<HMAC>''. Any ''2xx'' response is successful. Failed deliveries may be retried, so process them idempotently using the signed ''delivery.id'' value in the body. The ''X-VpsAdmin-Delivery'' header is not itself signed; the server above accepts it only when it equals ''delivery.id''.

      ===== Reference =====

      ==== Routes and matchers ====

      Manage routes at Notifications → Routes. Creating a route first saves its basic settings; matchers are added on its edit page afterwards. Every matcher on one route has to match. Event type is an exact value, while Event type pattern accepts a glob such as ''monitoring.*''.

      Reorder routes with the arrows or by dragging. **Continue: yes** passes the event to later matching routes. **Continue: no** stops processing at that level, which is essential for the **Mute** receiver.

      ==== Targets and receivers ====

      Manage targets from Notifications → Targets. A target contains a concrete address or account and its verification state. A receiver groups one or more targets, so one receiver can send an e-mail and call a webhook.

      Manage receivers under Notifications → Receivers. The default e-mail target follows the account's primary address. Custom e-mail, SMS, and Telegram targets must be verified or paired before delivery.

      {{:en:screenshots:vpsadmin:notifications:receiver.png?900|Receiver and target configuration}}

      ==== Time intervals ====

      Define reusable intervals under Notifications → Time intervals. Each has an IANA time zone and one or more specifications. Fields within one specification use logical **AND**; multiple ranges or specifications are alternatives.

      {{:en:screenshots:vpsadmin:notifications:time-interval.png?900|Time interval configuration}}

      Assign an interval under Notifications → Routes → edit route as an **Active interval** or **Mute interval**. With no active interval, the route's time is unrestricted. A matching mute interval suppresses that route's delivery.

      {{:en:screenshots:vpsadmin:notifications:route-time-intervals.png?900|Interval assigned to a route}}

      ==== Event log and delivery checks ====

      Inspect the result at Notifications → Event log → event detail. The detail shows matched routes, time-interval state, created deliveries, and the evaluation snapshot at the event timestamp. ''inactive'' means no active interval matched; ''muted'' means a mute interval matched.

      {{:en:screenshots:vpsadmin:notifications:event-suppressed.png?900|Event suppressed by a time interval}}

      **Test event** checks routing without causing a real suspension or incident, but its delivery is real: it can send e-mail, Telegram, SMS, or a webhook request.

