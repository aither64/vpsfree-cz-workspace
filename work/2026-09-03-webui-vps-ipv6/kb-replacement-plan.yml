    path: networking.host-addresses.add
    before: |-
      vpsAdmin only has the first host address from every network in its database. In case you need
      more host addresses, you can add them to vpsAdmin's database. In "Routed addresses" form, click
      on the icon with labeled "Manage host addresses" and then "Add host addresses".
    body: |-
      In the "Routed addresses"
      section of the VPS details, click the "Manage host addresses" icon, then click "Add host addresses".
    replacement: |-
      vpsAdmin initially adds only the first host address from each network to its database. If you
      need more host addresses, you can add them yourself. <vpsadmin-nav id="networking.host-addresses.add">In the "Routed addresses"
      section of the VPS details, click the "Manage host addresses" icon, then click "Add host addresses".</vpsadmin-nav>
