  - language: cs
    page: navody:server:primarni_dns
    before: >-
      Podporujeme následující DNS záznamy: A, AAAA, CNAME, DS, MX, NS, PTR, SRV, SSHFP, TLSA a TXT.
    replacement: |-
      Podporujeme následující DNS záznamy: A, AAAA, CAA, CNAME, DS, MX, NS, PTR, SRV, SSHFP, TLSA a TXT.

      U záznamů CAA se obsah zadává ve tvaru ''příznaky vlastnost "hodnota"'', například ''0 issue "letsencrypt.org"''. Povoleny jsou příznaky ''0'' a ''128'' a vlastnosti ''issue'', ''issuewild'', ''issuemail'', ''issuevmc'', ''iodef'', ''contactemail'' a ''contactphone''. Hodnota musí být neprázdná a uzavřená v dvojitých uvozovkách.
