  - language: en
    page: manuals:server:primary_dns
    before: >-
      We support the following DNS records: A, AAAA, CNAME, DS, MX, NS, PTR, SRV, SSHFP, TLSA, and TXT.
    replacement: |-
      We support the following DNS records: A, AAAA, CAA, CNAME, DS, MX, NS, PTR, SRV, SSHFP, TLSA, and TXT.

      Enter CAA content as ''flags property "value"'', for example ''0 issue "letsencrypt.org"''. Supported flags are ''0'' and ''128'' and supported properties are ''issue'', ''issuewild'', ''issuemail'', ''issuevmc'', ''iodef'', ''contactemail'', and ''contactphone''. The value must be non-empty and enclosed in double quotes.
    count: 1
