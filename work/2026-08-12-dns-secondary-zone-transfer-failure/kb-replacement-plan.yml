    before: |-
      V seznamu sekundárních serverů se zobrazuje jejich stav, tj. aktuální sériové číslo zóny
      a datumy posledního načtení, dalšího obnovení a expirace.
    replacement: |-
      V tabulce **Jmenné servery** uvidíš, jestli má každý přidělený sekundární server
      zónu načtenou a obsluhuje ji. Zobrazuje se také sériové číslo, poslední načtení,
      poslední kontrola, další obnovení, expirace a odkaz na záznamy přenosů.

      Tabulka **Primární servery** naproti tomu ověřuje připravenost každého tvého
      primárního serveru pro každý přidělený sekundární server. vpsAdmin z adresy
      sekundárního serveru pravidelně provede kontrolu připravenosti pomocí IXFR a
      použije stejný TSIG jako BIND, pokud je pro primární server nastavený. Když krátká
      kontrola nestačí nebo je potřeba ověřit obsah,
      stáhne dočasný AXFR a zónu zkontroluje. Zachovává také skutečné chyby přenosů,
      které hlásí BIND, například odmítnutí, chyby TSIG nebo neplatný obsah zóny.

      Stav **Úspěšný** znamená, že kontrola uspěla ze všech sekundárních serverů,
      **Nepodařilo se**, že selhala alespoň jedna cesta, a **Čeká**, že ještě chybí
      průkazný výsledek. Selhání jedné cesty nutně neznamená nedostupnou zónu: aktuální
      kopii mohl získat jiný sekundární server a předat ji ostatním. Chyba ale obvykle
      upozorňuje na nedostupný primární server, chybějící povolení AXFR/IXFR, nesprávný
      TSIG, staré sériové číslo nebo neplatnou zónu. Na síťovou chybu upozorňujeme až
      tehdy, když opakované neúspěšné kontroly stejné cesty pokrývají alespoň 24 hodin.
      Na ostatní potvrzené chyby upozorňujeme po 30 minutách.
    count: 1
  - language: en
    page: manuals:server:secondary_dns
    before: |-
      The list of secondary servers shows their status, i.e., the current zone serial number and the dates of the last load, the next refresh, and expiration.
    replacement: |-
      The **Name servers** table shows whether every assigned secondary has loaded and
      is serving the zone. It also shows the serial, load and check times, next refresh,
      expiration, and a link to transfer activity.

      The **Primary servers** table instead checks each of your primaries from every
      assigned secondary. vpsAdmin regularly sends an IXFR readiness check from the
      secondary's real transfer address, using the same TSIG as BIND when one is
      configured. When the short check is inconclusive or zone contents need validation, it downloads a
      temporary AXFR and validates the zone. Actual transfer errors reported by BIND,
      such as refusal, TSIG failure, or invalid zone contents, are retained as well.

      **Successful** means checks succeeded from every secondary, **Failed** means at
      least one path failed, and **Pending** means a conclusive result is still missing.
      One failed path does not necessarily make the zone unavailable: another secondary
      may have obtained a current copy and distributed it to its peers. The failure does,
      however, usually indicate an unreachable primary, missing AXFR/IXFR permission,
      incorrect TSIG, an old serial, or an invalid zone. We alert on a network error only
      after repeated failed checks on the same path span at least 24 hours. We alert on
      other confirmed errors after 30 minutes.
    count: 1
