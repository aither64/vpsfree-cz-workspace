  - language: en
    page: manuals:server:secondary_dns
    before: |-
      The list of secondary servers shows their status, i.e., the current zone serial number and the dates of the last load, the next refresh, and expiration.
    replacement: |-
      The list of secondary servers shows their status, i.e., the current zone serial number and the dates of the last load, the next refresh, and expiration.

      The **Direct transfers** column for primary servers shows whether the zone was
      transferred from them directly to all of our secondary servers. **Successful**
      means every secondary has confirmed a direct transfer, **Failed** means at least
      one direct path failed, and **Unknown** means not every path has been confirmed
      yet. A failed direct path does not necessarily make the zone unavailable because
      another secondary may have supplied a current copy. It usually indicates an
      unreachable primary, a missing transfer permission, or incorrect TSIG settings.
      We send network-unreachability alerts only after 24 hours and other confirmed
      errors after 30 minutes.
    count: 1
