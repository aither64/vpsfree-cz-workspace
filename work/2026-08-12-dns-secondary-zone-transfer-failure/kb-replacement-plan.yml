    before: |-
      Zone transfers between primary and secondary servers can be further secured using TSIG. First, create a shared key in the menu <vpsadmin-nav id="dns.tsig-keys.open">DNS -> TSIG keys</vpsadmin-nav>. Each key is identified by an arbitrary name, chosen algorithm, and secret code. These values must match on all servers. When adding primary servers to a zone, you can set the selected TSIG key. The sample configuration again shows how to set up TSIG on the primary server.
    replacement: |-
