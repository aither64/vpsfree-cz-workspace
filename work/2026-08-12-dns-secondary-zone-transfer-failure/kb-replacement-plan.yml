      klíč. V ukázkové konfiguraci je opět znázorněno, jak TSIG nastavit na primárním serveru.
    replacement: |-
      Přenos zón mezi primárními a sekundárními servery můžeš dále zabezpečit pomocí TSIG.
      V menu <vpsadmin-nav id="dns.tsig-keys.open">DNS -> TSIG klíče</vpsadmin-nav> si nejprve <vpsadmin-nav id="dns.tsig-keys.create">vytvoř sdílený klíč</vpsadmin-nav>. Každý klíč je identifikován
      libovolným názvem, zvoleným algoritmem a tajným kódem. Tyto hodnoty se musí shodovat
      na všech serverech. Při přidávání primárního serveru k zóně
      <vpsadmin-nav id="dns.secondary-zones.primary-tsig.select">vyber tento TSIG klíč</vpsadmin-nav>. V ukázkové konfiguraci uvidíš,
      jak TSIG nastavit na primárním serveru.
