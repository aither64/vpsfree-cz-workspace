    before: |-
      Přenos zón mezi primárními a sekundárními servery lze dále zabezpečit pomocí TSIG.
      V menu <vpsadmin-nav id="dns.tsig-keys.open">DNS -> TSIG klíče</vpsadmin-nav> si nejprve vytvoříme sdílený klíč. Každý klíč je identifikován
      libovolným názvem, zvoleným algoritmem a tajným kódem. Tyto hodnoty se musí shodovat
