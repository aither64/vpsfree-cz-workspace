    replacement: |-
      V seznamu sekundárních serverů se zobrazuje jejich stav, tj. aktuální sériové číslo zóny
      a datumy posledního načtení, dalšího obnovení a expirace.

      Sloupec **Přímé přenosy** u primárních serverů ukazuje, jestli se z nich zóna
      přenesla přímo na všechny naše sekundární servery. **Úspěšný** znamená, že přenos
      potvrdily všechny sekundární servery, **Nepodařilo se**, že selhala alespoň jedna
      přímá cesta, a **Neznámý**, že zatím nemáme potvrzení ze všech cest. Selhání přímé
      cesty nutně neznamená nedostupnou zónu, protože aktuální kopii mohl dodat jiný
      sekundární server. Obvykle ale upozorňuje na nedostupný primární server, chybějící
      povolení přenosu nebo nesprávný TSIG. Upozornění na síťovou nedostupnost posíláme
      až po 24 hodinách, ostatní potvrzené chyby po 30 minutách.
